<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://profile.line-scdn.net https://lh3.googleusercontent.com https://i.ytimg.com https://drive.google.com; media-src 'self' https://drive.usercontent.google.com; connect-src 'self' https://script.google.com https://script.googleusercontent.com; frame-src https://www.youtube.com https://drive.google.com; object-src 'none'; base-uri 'self'; form-action 'self' https://payment.ecpay.com.tw https://payment-stage.ecpay.com.tw https://emap.presco.com.tw https://access.line.me; script-src 'self' 'sha256-2CifhN8RTzeihDv81Y28NbrxhmBe9wRlttFszgDUrfM='">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="build" content="202611080116">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>赤貧軍團｜管理後台</title>
<link rel="icon" type="image/png" href="favicon.png?v=2">
<style>
:root{
  color-scheme:light dark;
  --bg:#F3ECDF; --card:#FFFCF5; --line:#E2D6C0; --text:#1A2130; --dim:#4A5163; --faint:#6E7383;
  --accent:#1C3F7C; --red:#D7261E; --ink:#17181D; --ok:#1F7A4A; --warn:#A85A00; --bad:#B3261E;
  --sel:rgba(28,63,124,.10); --wash:rgba(26,33,48,.055);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0C1424; --card:#142039; --line:#26355A; --text:#F3ECDF; --dim:#CBC4B6; --faint:#9A968C;
    --accent:#7FA8EC; --red:#E5372E; --ok:#5BD69B; --warn:#FFB650; --bad:#FF7B72;
    --sel:rgba(127,168,236,.17); --wash:rgba(243,236,223,.06);
  }
}
@media (prefers-color-scheme: dark){.btn.ink,.x{background:#2A3048}}
*{box-sizing:border-box}
[hidden]{display:none!important}
.f input:disabled,.f select:disabled{opacity:.6;cursor:not-allowed;border-style:dashed}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-feature-settings:"tnum"}
button{font:inherit;cursor:pointer}
button:disabled,button[aria-busy]{filter:grayscale(.6) opacity(.55);cursor:default}
.wrap{max-width:980px;margin:0 auto;padding:0 14px}
svg{width:20px;height:20px}

.top{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff}
.top .wrap{display:flex;align-items:center;gap:10px;height:54px}
.top img{width:32px;height:32px;border-radius:8px}
.top b{font-size:17px;font-weight:900;letter-spacing:.06em}
.top span{flex:1;color:#C9CBD2;font-size:13px;font-weight:700}
.top a,.top button{color:#fff;background:transparent;border:1px solid #444;border-radius:8px;padding:4px 10px;font-size:13px;text-decoration:none}
.tabs{position:sticky;top:54px;z-index:9;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px}
.tabs button{flex:1 1 0;min-width:0;border:0;border-radius:10px;padding:8px 0;font-size:14px;background:var(--card);color:var(--dim);font-weight:800;white-space:nowrap}
.tabs button[aria-pressed=true]{background:var(--red);color:#fff}

h2{font-size:18px;margin:18px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;color:var(--text);width:100%}
.row img,.row .ph{flex:none;width:52px;height:52px;border-radius:9px;object-fit:cover;background:var(--wash)}
.row .info{flex:1;min-width:0}
.row .info b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .info small{display:block;color:var(--dim);font-size:13px}
.row .right{text-align:right;flex:none}
.pill{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:1px 9px;white-space:nowrap}
.pill.on{background:rgba(31,122,74,.14);color:var(--ok)} .pill.off{background:var(--wash);color:var(--faint)}
.pill.new{background:var(--red);color:#fff} .pill.warn{background:rgba(168,90,0,.14);color:var(--warn)}
.btn{border:0;border-radius:10px;background:var(--red);color:#fff;font-weight:800;padding:9px 16px;white-space:nowrap}
.btn.ink{background:var(--ink)} .btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)} .btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btns .btn{flex:1}
.empty{padding:26px;text-align:center;color:var(--faint);font-weight:700}

.f{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.f label{font-size:13px;font-weight:800;color:var(--dim)}
.f input,.f select,.f textarea{font:inherit;color:var(--text);background:var(--bg);border:1.5px solid var(--faint);border-radius:10px;padding:8px 10px;width:100%}
.f textarea{min-height:90px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--accent)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f2 .f{margin:0}
.f .note{font-size:12px;color:var(--faint);font-weight:600}
.check{display:flex;align-items:center;gap:8px;font-weight:800;margin:10px 0}
.check input{width:20px;height:20px;accent-color:var(--red)}

.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;background:var(--wash)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:14px;line-height:1}
.thumb .setfirst{position:absolute;left:0;right:0;bottom:0;top:auto;width:auto;height:auto;border-radius:0;background:rgba(0,0,0,.65);color:#fff;font-size:11px;font-weight:800;padding:2px 0}
.thumb .first{position:absolute;left:0;right:0;bottom:0;background:var(--red);color:#fff;font-size:11px;font-weight:800;text-align:center}
.addimg{width:76px;height:76px;border-radius:10px;border:2px dashed var(--faint);background:transparent;color:var(--dim);font-weight:800;font-size:13px}
.tierrow{display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px;align-items:center;margin-bottom:6px}
.tierrow input{font:inherit;color:var(--text);background:var(--bg);border:1.5px solid var(--faint);border-radius:10px;padding:7px 9px;width:100%;min-width:0}
.tierrow span{font-size:13px;font-weight:800;color:var(--ok);min-width:42px}
.tierrow button{border:0;background:transparent;color:var(--bad);font-size:20px;width:30px}

.login{max-width:360px;margin:12vh auto 0;text-align:center}
.login img{width:84px;height:84px;border-radius:18px}
.login h1{font-size:22px;margin:10px 0 2px;letter-spacing:.1em}
.login .card{text-align:left;margin-top:16px}
.err{color:var(--bad);font-weight:700;font-size:13px;min-height:1.3em}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;font-weight:700;padding:9px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
@media (min-width:700px){.modal.open{align-items:center}}
.modal .panel{width:100%;max-width:620px;max-height:94vh;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media (min-width:700px){.modal .panel{border-radius:18px}}
.panel h3{margin:0 0 6px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.x{width:34px;height:34px;border:0;border-radius:50%;background:var(--ink);color:#fff;font-size:18px}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px}
.filters button{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--dim);border-radius:999px;padding:4px 12px;font-weight:800;font-size:13px}
.filters button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.otable{width:100%;border-collapse:collapse;margin:8px 0;font-size:14px}
.otable td{padding:5px 0;border-bottom:1px solid var(--line)}
.otable td:last-child{text-align:right}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--dim);font-weight:700} .kv dd{margin:0}
.statusbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:12px}
.statusbar button{border:1.5px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:8px 0;font-weight:800;font-size:13px}
.statusbar button[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
.ship{margin-top:12px;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.ship .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--ink);color:#fff;padding:8px 12px;font-weight:800}
.ship .hd button{border:0;border-radius:8px;background:var(--red);color:#fff;font-weight:800;padding:5px 12px;font-size:13px}
.ship .cp{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:0;border-top:1px solid var(--line);background:var(--bg);color:var(--text);text-align:left}
.ship .cp:first-of-type{border-top:0}
.ship .cp span{flex:none;width:64px;font-size:13px;font-weight:800;color:var(--dim)}
.ship .cp b{flex:1;min-width:0;font-weight:700;word-break:break-all}
.ship .cp i{flex:none;font-style:normal;font-size:12px;font-weight:800;color:var(--accent)}
.ship .cp.done i{color:var(--ok)}
.pwwarn{display:block;width:100%;margin-top:10px;border:0;border-radius:10px;background:var(--red);color:#fff;font-weight:800;padding:9px 12px;text-align:left}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.stats div{background:var(--ink);color:#fff;border-radius:12px;padding:10px;box-shadow:inset 0 -3px 0 var(--red)}
.stats small{display:block;color:#C9CBD2;font-size:12px;font-weight:700}
.stats b{font-size:20px;font-weight:900}

.rcard{margin-bottom:12px}
.subtabs{position:sticky;top:110px;z-index:5;background:var(--bg);padding:6px 0}
.subtabs button{flex:1}
.rh{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;font-size:17px}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:8px}
@media (min-width:640px){.rgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.rgrid div{background:var(--wash);border-radius:10px;padding:8px 10px}
.rgrid small{display:block;font-size:12px;color:var(--dim);font-weight:700}
.rgrid b{font-size:18px}
.rgrid b.ok{color:var(--ok)}
.rt th{text-align:right;font-size:12px;color:var(--dim);padding:6px 0;border-bottom:1px solid var(--line)}
.rt th:first-child{text-align:left}
.rt td{text-align:right}
.rt td:first-child{text-align:left;padding-right:8px}
@media print{.top,.tabs,.pwwarn,#rCsv,#rPrint,.filters{display:none!important}body{background:#fff;color:#000}.card,.stats div{break-inside:avoid}}

/* 電腦版放大（2026-11-07）*/
@media (min-width:900px){
  body{font-size:17px}
  .wrap{max-width:1180px;padding:0 24px}
  .top .wrap{height:64px} .top b{font-size:20px}
  .tabs button{font-size:17px;padding:11px 0}
  h2{font-size:22px}
  .row{padding:14px} .row .info b{font-size:17px} .row .info small{font-size:15px} .row img,.row .ph{width:64px;height:64px}
  .f label{font-size:15px} .f input,.f select,.f textarea{font-size:17px;padding:10px 12px}
  .btn{font-size:17px;padding:11px 20px}
  .stats b{font-size:26px} .stats small{font-size:14px}
  .rgrid b{font-size:22px} .rgrid small{font-size:14px}
  .otable{font-size:16px}
  .modal .panel{max-width:760px}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="modal" id="modal"><div class="panel" id="mPanel"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" hidden>

<script src="shop-core.js?v=202611080116"></script>
<script>
const $ = id => document.getElementById(id);
// 登入存在 localStorage，10 天內同一台裝置不用重新登入（到期由後端判斷）
let token = lsGet("cp-admin", "") || "";
// 分級權限：分頁依角色顯示（後端也會擋，這裡只是不顯示用不到的）
const TABS = [["orders", "訂單"], ["products", "商品"], ["videos", "短影音"], ["codes", "折扣碼"], ["report", "報表"], ["settings", "設定"]];
const ROLE_TABS = {owner: TABS.map(t => t[0]), staff: ["orders", "products", "videos", "codes", "settings"], shipper: ["orders", "settings"], viewer: ["report", "settings"]};
const ROLE_NAME = {owner: "管理者", staff: "營運", shipper: "出貨", viewer: "報表"};
const role = () => (data && data.me && data.me.role) || "owner";
let data = null, orders = null, tab = sessionStorage.getItem("cp-tab") || "orders", orderFilter = "新訂單";
const STATUSES = ["新訂單", "已確認", "已出貨", "已完成", "已取消"];

function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 2200); }
async function admin(action, body = {}, opts) {
  try { return await api({action, token, ...body}, opts); }
  catch (e) { if (e.message === "auth") { logout(); throw new Error("登入已逾時，請重新登入"); } throw e; }
}
function logout() { token = ""; lsSet("cp-admin", ""); drawLogin(); }

/* ── 登入 ── */
function drawLogin() {
  $("app").innerHTML = `<div class="wrap login"><img src="badge.png?v=1" alt=""><h1>管理後台</h1><div style="color:var(--dim);font-weight:700">赤貧軍團</div>
    <form class="card" id="loginForm">
      <div class="f"><label for="lu">帳號</label><input id="lu" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required></div>
      <div class="f"><label for="lp">密碼</label><input id="lp" type="password" autocomplete="current-password" required></div>
      <div class="err" id="lerr"></div>
      <button class="btn" style="width:100%" id="lbtn">登入</button>
    </form><p><a href="shop.html" style="color:var(--dim);font-size:13px">返回賣場</a></p></div>`;
  $("loginForm").onsubmit = e => {
    e.preventDefault();
    busy($("lbtn"), async () => {
      $("lerr").textContent = "";
      try {
        // 全形轉半形：中文輸入法常打出「０１」，看起來一樣但比對不過（2026-10-31 使用者登不進去的原因）
        const half = v => v.normalize("NFKC").trim();
        const r = await api({action: "login", user: half($("lu").value), pass: half($("lp").value)});
        token = r.token; lsSet("cp-admin", token);
        lsSet("cp-default-pw", r.isDefault ? "1" : "");
        await loadAll(); drawApp(); await openFromHash();
      } catch (err) { $("lerr").textContent = err.message; }
    });
  };
}

/* ── 主畫面 ── */
async function loadAll() { data = await admin("admin_all", {}, {tries: 3}); }
async function loadOrders() { orders = (await admin("admin_orders", {}, {tries: 3})).orders; }

function drawApp() {
  if (!ROLE_TABS[role()].includes(tab)) tab = ROLE_TABS[role()][0];
  $("app").innerHTML = `<header class="top"><div class="wrap"><img src="badge.png?v=1" alt=""><b>赤貧軍團</b><span>${esc(data.me ? data.me.user : "")}・${ROLE_NAME[role()]}</span>
      <a href="shop.html" target="_blank" rel="noopener">賣場</a><button id="outBtn">登出</button></div></header>
    <nav class="tabs"><div class="wrap">
      ${TABS.filter(([k]) => ROLE_TABS[role()].includes(k))
        .map(([k, n]) => `<button data-tab="${k}" aria-pressed="${tab === k}">${n}</button>`).join("")}</div></nav>
    ${lsGet("cp-default-pw", "") === "1" && role() === "owner" ? '<div class="wrap"><button class="pwwarn" data-gopw>目前為初始密碼，任何人都可能登入，請立即變更 ›</button></div>' : ""}
    <main class="wrap" id="main"></main>`;
  $("outBtn").onclick = logout;
  const gp = document.querySelector("[data-gopw]"); if (gp) gp.onclick = () => { tab = "settings"; sessionStorage.setItem("cp-tab", tab); drawApp(); };
  document.querySelector(".tabs").onclick = e => { const b = e.target.closest("[data-tab]"); if (b) { tab = b.dataset.tab; sessionStorage.setItem("cp-tab", tab); drawApp(); } };
  ({orders: drawOrders, products: drawProducts, videos: drawVideos, codes: drawCodes, report: drawReport, settings: drawSettings})[tab]();
}

/* ── 訂單 ── */
async function drawOrders() {
  const main = $("main");
  if (!orders) { main.innerHTML = '<div class="empty">載入訂單中…</div>'; try { await loadOrders(); } catch (e) { main.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; } }
  if (!document.body.contains(main)) return; // 載入期間切到別的分頁：畫面已換掉，不再畫
  const today = new Date().toLocaleDateString("sv-SE", {timeZone: "Asia/Taipei"});
  const valid = orders.filter(o => o.status !== "已取消");
  const todayOrders = valid.filter(o => o.createdAt.startsWith(today));
  const list = orderFilter === "全部" ? orders : orders.filter(o => o.status === orderFilter);
  main.innerHTML = `<h2>訂單 <button class="btn ghost" id="reload">重新整理</button></h2>
    <div class="stats"><div><small>待處理</small><b>${orders.filter(o => o.status === "新訂單").length}</b></div>
      <div><small>今日訂單</small><b>${todayOrders.length}</b></div><div><small>今日營業額</small><b>${money(todayOrders.reduce((s, o) => s + o.total, 0))}</b></div></div>
    <div class="filters">${["新訂單", "已確認", "已出貨", "已完成", "已取消", "全部"].map(s => `<button data-f="${s}" aria-pressed="${orderFilter === s}">${s} ${s === "全部" ? orders.length : orders.filter(o => o.status === s).length}</button>`).join("")}</div>
    <div class="list">${list.length ? list.map(o => `<button class="row" data-o="${esc(o.orderNo)}">
      <div class="info"><b>${esc(o.name)}　${esc(o.phone)}</b><small>${esc(o.orderNo)}・${esc(o.createdAt)}・${esc(o.shipMethod)}</small></div>
      <div class="right"><b>${money(o.total)}</b><br><span class="pill ${o.status === "新訂單" ? "new" : o.status === "已取消" ? "off" : "on"}">${esc(o.status)}</span></div></button>`).join("") : '<div class="empty">尚無訂單</div>'}</div>`;
  $("reload").onclick = e => busy(e.target, async () => { await loadOrders(); drawOrders(); });
  main.querySelector(".filters").onclick = e => { const b = e.target.closest("[data-f]"); if (b) { orderFilter = b.dataset.f; drawOrders(); } };
  main.querySelector(".list").onclick = e => { const b = e.target.closest("[data-o]"); if (b) openOrder(b.dataset.o); };
}
/* 寄件資料：每一欄點一下就複製，貼進黑貓宅急便／7-11 交貨便的對應欄位 */
function shipFields(o) {
  const goods = o.items.map(i => i.name).join("、");
  const name = goods.length > 20 ? goods.slice(0, 19) + "…" : goods; // 品名欄位短，過長截斷
  if (o.shipMethod.startsWith("7-11")) {
    const m = o.address.match(/^7-11 (.+?)門市（店號 (\w*)）(.*)$/) || [];
    return [["收件人", o.name], ["手機", o.phone], ["門市", m[1] ? m[1] + "門市" : o.address], ["店號", m[2] || ""], ["包裹數", `${o.packages || 1} 個交貨便`], ["品名", name]];
  }
  const m = o.address.match(/^(\d{3})(.*)$/) || [];
  return [["收件人", o.name], ["手機", o.phone], ["郵遞區號", m[1] || ""], ["地址", m[2] || o.address], ["包裹數", `${o.packages || 1} 箱宅急便`], ["品名", name], ["備註", o.note]];
}
function shipBlock(o) {
  const f = shipFields(o).filter(([, v]) => v);
  return `<div class="ship"><div class="hd"><span>${o.shipMethod.startsWith("7-11") ? "7-11 交貨便" : "黑貓寄件"}資料</span><button data-cpall>全部複製</button></div>
    ${f.map(([k, v]) => `<button class="cp" data-cp="${esc(v)}"><span>${k}</span><b>${esc(v)}</b><i>複製</i></button>`).join("")}</div>`;
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); }
  catch (e) { const a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); document.execCommand("copy"); a.remove(); }
}
/* 出貨單（A4／可直接貼箱）：收件資料大字、品項勾選欄、包裹數；用隱藏 iframe 列印，不跳新視窗 */
function printSlip(o) {
  const cvs = o.shipMethod.startsWith("7-11"), f = shipFields(o);
  const html = `<!doctype html><meta charset="utf-8"><title>${esc(o.orderNo)}</title><style>
    @page{size:A4;margin:14mm}body{font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;color:#000}
    .hd{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #000;padding-bottom:8px}
    .hd b{font-size:26px;letter-spacing:.1em}.no{font-size:22px;font-weight:900;letter-spacing:.06em}
    .to{border:3px solid #000;border-radius:10px;padding:14px 18px;margin:16px 0}
    .to .k{font-size:14px;color:#555}.to .v{font-size:24px;font-weight:800;margin-bottom:8px;word-break:break-all}
    .ship{display:inline-block;background:#000;color:#fff;font-weight:900;font-size:20px;padding:4px 14px;border-radius:6px}
    table{width:100%;border-collapse:collapse;margin-top:10px;font-size:17px}th,td{border:1.5px solid #000;padding:8px 10px;text-align:left}
    th{background:#eee}td.c{width:60px;text-align:center}.foot{margin-top:18px;font-size:14px;color:#333}</style>
    <div class="hd"><b>赤貧軍團　出貨單</b><span class="no">${esc(o.orderNo)}</span></div>
    <p><span class="ship">${esc(o.shipMethod)}・${o.packages || 1} ${cvs ? "個交貨便" : "箱宅急便"}</span>　下單 ${esc(o.createdAt)}　${o.payStatus === "paid" ? "已付款" : "未付款"}</p>
    <div class="to">${f.filter(([k]) => !["品名", "包裹數"].includes(k)).map(([k, v]) => v ? `<div class="k">${k}</div><div class="v">${esc(v)}</div>` : "").join("")}</div>
    <table><tr><th>品項</th><th>數量</th><th>撿貨</th></tr>${o.items.map(i => `<tr><td>${esc(i.name)}</td><td class="c">${i.qty}</td><td class="c">□</td></tr>`).join("")}</table>
    <div class="foot">應收金額 ${money(o.total)}（運費 ${o.shipping ? money(o.shipping) : "免運"}）</div>`;
  const fr = document.createElement("iframe"); fr.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0";
  document.body.appendChild(fr); fr.contentDocument.open(); fr.contentDocument.write(html); fr.contentDocument.close();
  setTimeout(() => { fr.contentWindow.focus(); fr.contentWindow.print(); setTimeout(() => fr.remove(), 2000); }, 300);
}
function openOrder(no) {
  const o = orders.find(x => x.orderNo === no);
  $("mPanel").innerHTML = `<h3>${esc(o.orderNo)}<button class="x" data-x>×</button></h3>
    <dl class="kv"><dt>下單時間</dt><dd>${esc(o.createdAt)}</dd><dt>姓名</dt><dd>${esc(o.name)}</dd>
      <dt>手機</dt><dd><a href="tel:${esc(o.phone)}">${esc(o.phone)}</a></dd>${o.line ? `<dt>LINE</dt><dd>${esc(o.line)}</dd>` : ""}
      <dt>寄送</dt><dd>${esc(o.shipMethod)}${o.address ? `　${esc(o.address)}` : ""}</dd>${o.note ? `<dt>備註</dt><dd>${esc(o.note)}</dd>` : ""}
      <dt>付款</dt><dd>${o.payStatus === "paid" ? "已付款" : o.payStatus === "awaiting" ? "待付款" : o.payStatus === "failed" ? "付款失敗" : "未付款"}${o.payMethod ? `（${/^Credit/.test(o.payMethod) ? "信用卡" : /^ATM/.test(o.payMethod) ? "ATM 轉帳" : esc(o.payMethod)}）` : ""}${o.paidAt ? `　${esc(o.paidAt)}` : ""}</dd>
      ${o.payFee ? `<dt>金流手續費</dt><dd>${money(o.payFee)}</dd>` : ""}
      ${o.vaAccount ? `<dt>虛擬帳號</dt><dd>${esc(o.vaBank)}－${esc(o.vaAccount)}（期限 ${esc(o.vaExpire)}）</dd>` : ""}</dl>
    <table class="otable">${o.items.map(i => `<tr><td>${esc(i.name)}<br><small style="color:var(--dim)">${money(i.unit)} × ${i.qty}</small></td><td>${money(i.total)}</td></tr>`).join("")}
      ${o.tierSaving ? `<tr><td>多件優惠（已含於單價）</td><td>−${money(o.tierSaving)}</td></tr>` : ""}
      ${o.codeDiscount ? `<tr><td>折扣碼 ${esc(o.code)}</td><td>−${money(o.codeDiscount)}</td></tr>` : ""}
      <tr><td>運費（${o.packages || 1} 個包裹）</td><td>${o.shipping ? money(o.shipping) : "免運"}</td></tr>
      <tr><td><b>應付金額</b></td><td><b style="color:var(--red);font-size:18px">${money(o.total)}</b></td></tr></table>
    ${shipBlock(o)}
    <button class="btn ink" data-print style="width:100%;margin-top:12px">列印出貨單</button>
    <div class="statusbar">${STATUSES.map(s => `<button data-s="${s}" aria-pressed="${o.status === s}">${s}</button>`).join("")}</div>
    <div class="btns">${role() === "owner" ? '<button class="btn danger" data-odel style="flex:none">刪除</button>' : ""}${/^(owner|staff)$/.test(role()) ? `<button class="btn ${o.payStatus === "paid" ? "ghost" : "ink"}" data-pay>${o.payStatus === "paid" ? "改為未付款" : "標記已付款"}</button>` : ""}</div>`;
  openModal();
  $("mPanel").onclick = e => {
    if (e.target.closest("[data-x]")) return closeModal();
    if (e.target.closest("[data-print]")) return printSlip(o);
    const cp = e.target.closest("[data-cp]");
    if (cp) { copyText(cp.dataset.cp).then(() => { cp.classList.add("done"); cp.querySelector("i").textContent = "已複製"; }); return; }
    if (e.target.closest("[data-cpall]")) { copyText(shipFields(o).filter(([, v]) => v).map(([k, v]) => `${k}：${v}`).join("\n")).then(() => toast("已複製寄件資料")); return; }
    const s = e.target.closest("[data-s]");
    if (s && s.dataset.s !== o.status) busy(s, async () => {
      await admin("admin_orderStatus", {orderNos: [o.orderNo], value: s.dataset.s}, {tries: 2});
      o.status = s.dataset.s; toast("已更新為「" + o.status + "」"); openOrder(no); drawOrders();
    }).catch(err => toast(err.message));
    const od = e.target.closest("[data-odel]");
    if (od) { if (od.dataset.confirm !== "1") { od.dataset.confirm = "1"; od.textContent = "確認刪除"; return; }
      busy(od, async () => { await admin("admin_deleteOrder", {orderNo: o.orderNo}); orders = orders.filter(x => x !== o); closeModal(); drawOrders(); toast("已刪除訂單"); }).catch(err => toast(err.message)); return; }
    const p = e.target.closest("[data-pay]");
    if (p) busy(p, async () => {
      const v = o.payStatus === "paid" ? "unpaid" : "paid";
      await admin("admin_orderStatus", {orderNos: [o.orderNo], field: "payStatus", value: v}, {tries: 2});
      o.payStatus = v; toast(v === "paid" ? "已標記付款" : "已改為未付款"); openOrder(no);
    }).catch(err => toast(err.message));
  };
}

  const ps = data.products;
  $("main").innerHTML = `<h2>商品 ${ps.length} 項 <button class="btn" id="newP">新增商品</button></h2>
    <div class="list">${ps.length ? ps.map(p => `<button class="row" data-p="${esc(p.id)}">
      ${p.images[0] ? `<img src="${esc(imgUrl(p.images[0], 150))}" alt="">` : '<div class="ph"></div>'}
      <div class="info"><b>${esc(p.name)}</b><small>${p.preorder ? "即將開賣・" : ""}${p.cvsPer || p.homePer ? `交貨便 ${p.cvsPer || "∞"}／宅急便 ${p.homePer || "∞"} 件・` : ""}${p.supplier ? `貨主 ${esc(p.supplier)} ${p.commission}%・` : ""}${p.brand ? esc(p.brand) + "・" : ""}${esc(catName(p.category))}・${money(p.price)}・${p.cvsOk ? "黑貓／7-11" : "僅黑貓"}${p.tiers.length ? `・多件優惠 ${p.tiers.length} 段` : ""}・庫存 ${p.stock < 0 ? "不限" : p.stock}・已售 ${p.sold || 0}</small></div>
      <div class="right"><span class="pill ${p.active ? "on" : "off"}">${p.active ? "上架" : "下架"}</span>${p.hot ? '<br><span class="pill new">熱銷</span>' : ""}</div></button>`).join("") : '<div class="empty">尚無商品</div>'}</div>`;
  $("newP").onclick = () => editProduct(null);
  $("main").querySelector(".list").onclick = e => { const b = e.target.closest("[data-p]"); if (b) editProduct(b.dataset.p); };
}
function editProduct(id) {
  const src = id ? data.products.find(p => p.id === id) : null;
  const p = src ? JSON.parse(JSON.stringify(src)) : {name: "", category: "battery", price: "", listPrice: "", desc: "", images: [], tiers: [], stock: -1, active: true, hot: false, cvsOk: false,
    sort: Math.min(0, ...data.products.map(x => x.sort)) - 1};
  const draw = () => {
    $("mPanel").innerHTML = `<h3>${id ? "編輯商品" : "新增商品"}<button class="x" data-x>×</button></h3>
      <div class="f"><label>商品圖片（第一張為封面）</label><div class="thumbs">
        ${p.images.map((s, i) => `<div class="thumb"><img src="${esc(imgUrl(s, 200))}" alt=""><button data-rm="${i}" aria-label="移除">×</button>${i === 0 ? '<span class="first">封面</span>' : `<button class="setfirst" data-first="${i}">設為封面</button>`}</div>`).join("")}
        <button class="addimg" data-addimg>＋ 圖片</button></div></div>
      <div class="f"><label for="pn">商品名稱</label><input id="pn" value="${esc(p.name)}"></div>
      <div class="f"><label for="pb">品牌（選填）</label><input id="pb" list="brandList" value="${esc(p.brand || "")}" placeholder="例：MJX、Gens Ace">
        <datalist id="brandList">${[...new Set(data.products.map(x => x.brand).filter(Boolean))].map(b => `<option value="${esc(b)}">`).join("")}</datalist>
        <span class="note">賣場「品牌」區依此分組；已用過的品牌可直接選，名稱要一致才會歸在同一個品牌</span></div>
      <div class="f2"><div class="f"><label for="pc">分類</label><select id="pc">${CATEGORIES.map(([k, n]) => `<option value="${k}" ${p.category === k ? "selected" : ""}>${n}</option>`).join("")}</select></div>
        <div class="f"><label for="ps">庫存</label><input id="ps" type="number" inputmode="numeric" placeholder="不限" value="${p.stock < 0 ? "" : p.stock}"><span class="note">空白＝不限量；0＝售完</span></div></div>
      <div class="f2"><div class="f"><label for="pp">售價</label><input id="pp" type="number" inputmode="numeric" value="${p.price}"></div>
        <div class="f"><label for="pl">原價（選填）</label><input id="pl" type="number" inputmode="numeric" value="${p.listPrice || ""}"><span class="note">高於售價時顯示刪除線</span></div></div>
      <div class="f"><label>多件優惠</label><div id="tiers">${p.tiers.map((t, i) => `<div class="tierrow">
          <input type="number" inputmode="numeric" data-tq="${i}" value="${t.qty}" placeholder="件數" aria-label="件數">
          <input type="number" inputmode="numeric" data-tp="${i}" value="${t.price}" placeholder="每件價格" aria-label="每件價格">
          <span>${zhe(t.price, Number(p.price)) || ""}</span><button data-trm="${i}" aria-label="刪除">×</button></div>`).join("")}</div>
        <button class="btn ghost" data-tadd style="align-self:flex-start">＋ 新增級距</button><span class="note">例：2 件以上每件 $900、3 件以上每件 $850</span></div>
      <div class="f"><label for="pd">商品介紹</label><textarea id="pd">${esc(p.desc)}</textarea></div>
      <div class="f2"><div class="f"><label for="psu">貨主（替別人賣的商品填寫）</label><input id="psu" list="supList" value="${esc(p.supplier || "")}" placeholder="例：赤貧軍團；空白＝自有商品">
          <datalist id="supList">${[...new Set(data.products.map(x => x.supplier).filter(Boolean))].map(b => `<option value="${esc(b)}">`).join("")}</datalist></div>
        <div class="f"><label for="pcm">我方分潤 %</label><input id="pcm" type="number" inputmode="decimal" min="0" max="100" step="0.5" value="${p.supplier ? p.commission : ""}" placeholder="例：5"><span class="note">例：代營運 5、對分 50；報表依此計算我方分潤與應付貨主</span></div></div>
      <label class="check"><input type="checkbox" id="pa" ${p.active ? "checked" : ""}>上架</label>
      <label class="check"><input type="checkbox" id="ppo" ${p.preorder ? "checked" : ""}>即將開賣（顯示但不能下單）</label>
      <label class="check"><input type="checkbox" id="ph" ${p.hot ? "checked" : ""}>標示熱銷</label>
      <label class="check"><input type="checkbox" id="pv" ${p.cvsOk ? "checked" : ""}>可 7-11 店到店（小件）</label>
      <div class="f2"><div class="f"><label for="pcv">一個交貨便可裝幾件</label><input id="pcv" type="number" inputmode="numeric" min="0" value="${p.cvsPer || ""}" placeholder="不限"></div>
        <div class="f"><label for="phm">一箱宅急便可裝幾件</label><input id="phm" type="number" inputmode="numeric" min="0" value="${p.homePer || ""}" placeholder="不限"></div></div>
      <span class="note" style="display:block;margin-top:-4px">訂單自動算出要寄幾個包裹，運費依包裹數計算；空白＝不限（整單一個包裹）</span>
      <span class="note" style="margin:-6px 0 0 28px;display:block">未勾選＝僅限黑貓宅配；7-11 限 45×30×30 公分、5 公斤內</span>
      <div class="err" id="perr"></div>
      <div class="btns">${id ? '<button class="btn danger" data-del style="flex:none">刪除</button>' : ""}<button class="btn" data-save>儲存</button></div>`;
  };
  const read = () => {
    p.name = $("pn").value.trim(); p.category = $("pc").value; p.price = Number($("pp").value) || 0; p.listPrice = Number($("pl").value) || 0;
    p.stock = $("ps").value === "" ? -1 : Number($("ps").value); p.desc = $("pd").value; p.active = $("pa").checked; p.hot = $("ph").checked; p.cvsOk = $("pv").checked; p.cvsPer = Number($("pcv").value) || 0; p.homePer = Number($("phm").value) || 0; p.brand = $("pb").value.trim(); p.supplier = $("psu").value.trim(); p.commission = p.supplier ? Number($("pcm").value) || 0 : 0; p.preorder = $("ppo").checked;
    p.tiers = [...document.querySelectorAll("[data-tq]")].map((el, i) => ({qty: Number(el.value) || 0, price: Number(document.querySelector(`[data-tp="${i}"]`).value) || 0}));
  };
  draw(); openModal();
  $("mPanel").oninput = e => { if (e.target.matches("[data-tp],[data-tq],#pp")) { read(); [...document.querySelectorAll(".tierrow span")].forEach((s, i) => s.textContent = zhe(p.tiers[i].price, p.price)); } };
  $("mPanel").onclick = async e => {
    if (e.target.closest("[data-x]")) return closeModal();
    if (e.target.closest("[data-tadd]")) { read(); const last = p.tiers.slice(-1)[0]; p.tiers.push({qty: last ? last.qty + 1 : 2, price: ""}); draw(); return; }
    const trm = e.target.closest("[data-trm]"); if (trm) { read(); p.tiers.splice(Number(trm.dataset.trm), 1); draw(); return; }
    const rm = e.target.closest("[data-rm]"); if (rm) { read(); p.images.splice(Number(rm.dataset.rm), 1); draw(); return; }
    const sf = e.target.closest("[data-first]"); if (sf) { read(); p.images.unshift(p.images.splice(Number(sf.dataset.first), 1)[0]); draw(); return; }
    const add = e.target.closest("[data-addimg]");
    if (add) { read(); const files = await pickFiles("image/*", true); if (!files.length) return;
      await busy(add, async () => { for (const f of files) { add.textContent = "上傳中"; p.images.push(await uploadImage(f)); } }).catch(err => toast(err.message)); draw(); return; }
    const save = e.target.closest("[data-save]");
    if (save) { read();
      if (!p.name) return $("perr").textContent = "請填寫商品名稱";
      if (!(p.price > 0)) return $("perr").textContent = "請填寫售價";
      if (p.supplier && !(p.commission > 0 && p.commission < 100)) return $("perr").textContent = "有貨主的商品請填寫我方分潤 %（1–99）";
      const bad = p.tiers.find(t => !(t.qty >= 2) || !(t.price > 0) || t.price >= p.price);
      if (bad) return $("perr").textContent = "多件優惠：件數需 2 以上，每件價格需低於售價";
      busy(save, async () => { await admin("admin_saveProduct", {product: {...p, id}}); await loadAll(); closeModal(); drawProducts(); toast("已儲存"); })
        .catch(err => $("perr").textContent = err.message); }
    const del = e.target.closest("[data-del]");
    if (del) { if (del.dataset.confirm !== "1") { del.dataset.confirm = "1"; del.textContent = "確認刪除"; return; }
      busy(del, async () => { await admin("admin_deleteProduct", {id}); await loadAll(); closeModal(); drawProducts(); toast("已刪除"); }).catch(err => toast(err.message)); }
  };
}

function editVideo(id) {
  const src = id ? data.videos.find(v => v.id === id) : null;
  const v = src ? {...src} : {title: "", src: "", poster: "", productId: "", active: true, sort: Math.min(0, ...data.videos.map(x => x.sort)) - 1};
  const draw = () => {
    const info = videoInfo(v.src);
    $("mPanel").innerHTML = `<h3>${id ? "編輯影片" : "新增影片"}<button class="x" data-x>×</button></h3>
      <div class="f"><label for="vt">標題</label><input id="vt" value="${esc(v.title)}" placeholder="例：3S 2700mAh 實測"></div>
      <div class="f"><label>影片</label>
        <div class="btns" style="margin:0"><button class="btn ink" data-upv>上傳影片檔</button></div>
        <span class="note">直式 MP4 為佳（手機錄影即可），單支 30MB 以內；賣場會自動靜音循環播放</span>
        <input id="vs" value="${esc(/^(drive:|media\/)/.test(v.src) ? "" : v.src)}" placeholder="${/^(drive:|media\/)/.test(v.src) ? "已上傳影片檔" : "https://youtube.com/shorts/…"}">
        ${info ? `<span class="note" style="color:var(--ok)">${/^media\//.test(v.src) || info.kind === "drive" ? "已上傳影片檔" : info.kind === "youtube" ? "YouTube 影片" : "影片連結"}</span>` : ""}</div>
      <div class="f"><label>封面（選填）</label><div class="thumbs">
        ${v.poster ? `<div class="thumb"><img src="${esc(imgUrl(v.poster, 200))}" alt=""><button data-rmp aria-label="移除">×</button></div>` : ""}
        <button class="addimg" data-upp>＋ 封面</button></div><span class="note">未設定時自動使用影片畫面</span></div>
      <div class="f"><label for="vp">連結商品（選填）</label><select id="vp"><option value="">不連結</option>
        ${data.products.map(p => `<option value="${esc(p.id)}" ${v.productId === p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select></div>
      <label class="check"><input type="checkbox" id="va" ${v.active ? "checked" : ""}>上架</label>
      <div class="err" id="verr"></div>
      <div class="btns">${id ? '<button class="btn danger" data-del style="flex:none">刪除</button>' : ""}<button class="btn" data-save>儲存</button></div>`;
  };
  const read = () => { v.title = $("vt").value.trim(); const s = $("vs").value.trim(); if (s) v.src = s; v.productId = $("vp").value; v.active = $("va").checked; };
  draw(); openModal();
  $("mPanel").onclick = async e => {
    if (e.target.closest("[data-x]")) return closeModal();
    const upv = e.target.closest("[data-upv]");
    if (upv) { read(); const [f] = await pickFiles("video/*"); if (!f) return;

/* ── 報表（2026-11-07）：營業概況＋代銷結算（供貨商 × 抽成 %）＋商品明細，可匯出 CSV、列印 ──
   計算口徑：排除「已取消」；商品金額＝成交單價×數量（已含多件優惠）；折扣碼依各品項金額比例分攤；
   運費另計、不分給供貨商；抽成與供貨商以「下單當下」記在訂單裡的值為準。 */
let rpt = {range: "month", from: "", to: "", withUnpaid: false}; // 預設只算已付款（使用者 2026-11-07：有收錢才出貨）
const ymd = d => d.toLocaleDateString("sv-SE", {timeZone: "Asia/Taipei"});
function rptRange() {
  const now = new Date(), y = +ymd(now).slice(0, 4), m = +ymd(now).slice(5, 7);
  const first = (yy, mm) => `${yy}-${String(mm).padStart(2, "0")}-01`;
  const last = (yy, mm) => ymd(new Date(Date.UTC(yy, mm, 0, 12)));
  if (rpt.range === "month") return [first(y, m), ymd(now)];
  if (rpt.range === "last") { const ly = m === 1 ? y - 1 : y, lm = m === 1 ? 12 : m - 1; return [first(ly, lm), last(ly, lm)]; }
  if (rpt.range === "year") return [`${y}-01-01`, ymd(now)];
  return [rpt.from || "2000-01-01", rpt.to || ymd(now)];
}
function rptCompute() {
  const [from, to] = rptRange();
  const inRange = o => o.status !== "已取消" && o.createdAt.slice(0, 10) >= from && o.createdAt.slice(0, 10) <= to;
  const os = orders.filter(o => inRange(o) && (rpt.withUnpaid || o.payStatus === "paid"));
  const unpaid = orders.filter(o => inRange(o) && o.payStatus !== "paid");
  // 金流手續費：依各品項占「訂單總額（含運費）」的比例分攤到品項，運費那一份由我方負擔
  // 分攤方式（設定 feeSplit）：ratio＝先扣手續費再依分潤比例拆、us＝我方全付、owner＝貨主全付
  const split = data.settings.feeSplit || "ratio";
  const lines = [];
  for (const o of os) {
    const base = o.items.reduce((a, i) => a + i.total, 0) || 1, tot = o.total || 1;
    for (const i of o.items) {
      const disc = Math.round(o.codeDiscount * i.total / base), net = i.total - disc;
      const pf = Math.round((o.payFee || 0) * net / tot);
      const rate = i.supplier ? Number(i.commission) || 0 : 0;
      let fee, payable;
      if (!i.supplier) { fee = 0; payable = 0; }
      else if (split === "us") { fee = Math.round(net * rate / 100) - pf; payable = net - Math.round(net * rate / 100); }
      else if (split === "owner") { fee = Math.round(net * rate / 100); payable = net - fee - pf; }
      else { const b = net - pf; fee = Math.round(b * rate / 100); payable = b - fee; }
      lines.push({date: o.createdAt.slice(0, 10), orderNo: o.orderNo, status: o.status, paid: o.payStatus === "paid", name: i.name, qty: i.qty, unit: i.unit,
        gross: i.total, disc, net, pf, supplier: i.supplier || "", rate, fee, payable});
    }
  }
  const sum = (arr, k) => arr.reduce((a, x) => a + x[k], 0);
  const sup = {};
  for (const l of lines.filter(l => l.supplier)) {
    const g = sup[l.supplier] = sup[l.supplier] || {name: l.supplier, lines: [], prods: {}};
    g.lines.push(l);
    const pp = g.prods[l.name] = g.prods[l.name] || {name: l.name, qty: 0, net: 0, pf: 0, fee: 0, payable: 0};
    pp.qty += l.qty; pp.net += l.net; pp.pf += l.pf; pp.fee += l.fee; pp.payable += l.payable;
  }
  return {from, to, os, lines, sum, sup: Object.values(sup),
    own: lines.filter(l => !l.supplier), ship: os.reduce((a, o) => a + o.shipping, 0), code: os.reduce((a, o) => a + o.codeDiscount, 0),
    payFee: os.reduce((a, o) => a + (o.payFee || 0), 0), unpaid};
}
async function drawReport() {
  const main = $("main");
  if (!orders) { main.innerHTML = '<div class="empty">載入訂單中…</div>'; try { await loadOrders(); } catch (e) { main.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; } }
  if (!document.body.contains(main)) return; // 載入期間切到別的分頁：畫面已換掉，不再畫
  const r = rptCompute(), S = r.sum, split = data.settings.feeSplit || "ratio";
  const supRows = r.sup.map(g => `<div class="card rcard">
      <h3 class="rh">${esc(g.name)}<span class="pill on">我方分潤 ${[...new Set(g.lines.map(l => l.rate))].join("／")}%</span></h3>
      <div class="rgrid"><div><small>銷售額（折扣後）</small><b>${money(S(g.lines, "net"))}</b></div><div><small>我方分潤</small><b class="ok">${money(S(g.lines, "fee"))}</b></div>
        <div><small>應付貨主</small><b>${money(S(g.lines, "payable"))}</b></div><div><small>金流手續費</small><b>${money(S(g.lines, "pf"))}</b></div></div>
      <table class="otable rt"><tr><th>商品</th><th>件數</th><th>銷售額</th><th>手續費</th><th>我方分潤</th><th>應付</th></tr>
        ${Object.values(g.prods).sort((a, b) => b.net - a.net).map(p => `<tr><td>${esc(p.name)}</td><td>${p.qty}</td><td>${money(p.net)}</td><td>${money(p.pf)}</td><td>${money(p.fee)}</td><td>${money(p.payable)}</td></tr>`).join("")}</table>
    </div>`).join("");
  main.innerHTML = `<h2>報表 <span style="display:flex;gap:6px"><button class="btn ghost" id="rCsv">匯出 CSV</button><button class="btn ghost" id="rPrint">列印</button></span></h2>
    <div class="filters">${[["month", "本月"], ["last", "上月"], ["year", "今年"], ["custom", "自訂"]].map(([k, n]) => `<button data-r="${k}" aria-pressed="${rpt.range === k}">${n}</button>`).join("")}
      <button data-paid aria-pressed="${rpt.withUnpaid}">含未付款</button></div>
    ${rpt.range === "custom" ? `<div class="f2" style="margin-bottom:10px"><div class="f"><label for="rf">開始</label><input id="rf" type="date" value="${rpt.from}"></div><div class="f"><label for="rt">結束</label><input id="rt" type="date" value="${rpt.to}"></div></div>` : ""}
    <div class="note" style="margin-bottom:8px">${r.from} ～ ${r.to}・${rpt.withUnpaid ? "含未付款訂單（僅供參考，未收款不出貨）" : "只算已付款"}・排除已取消</div>
    ${!rpt.withUnpaid && r.unpaid.length ? `<div class="card" style="margin-bottom:10px;padding:10px 14px"><b>待付款 ${r.unpaid.length} 筆・${money(r.unpaid.reduce((a, o) => a + o.total, 0))}</b><span class="note" style="display:block">尚未收款、未出貨，不列入營收與拆帳；收款後自動計入</span></div>` : ""}
    <div class="stats"><div><small>商品銷售額</small><b>${money(S(r.lines, "net"))}</b></div><div><small>訂單</small><b>${r.os.length}</b></div><div><small>件數</small><b>${S(r.lines, "qty")}</b></div></div>
    <div class="stats"><div><small>我方分潤</small><b>${money(S(r.lines, "fee"))}</b></div><div><small>應付貨主</small><b>${money(S(r.lines, "payable"))}</b></div><div><small>自有商品銷售</small><b>${money(S(r.own, "net"))}</b></div></div>
    <div class="note" style="margin:-4px 0 10px">金流手續費 ${money(r.payFee)}（${{ratio: "先扣手續費再依分潤比例拆", us: "我方全額負擔", owner: "貨主全額負擔"}[split]}）・運費 ${money(r.ship)}・折扣碼折抵 ${money(r.code)}（已依比例自各品項扣除）</div>
    <h2>貨主結算</h2>${supRows || '<div class="empty">此期間沒有代營運商品的訂單</div>'}`;
  main.querySelector(".filters").onclick = e => {
    const b = e.target.closest("[data-r]"); if (b) { rpt.range = b.dataset.r; drawReport(); }
    if (e.target.closest("[data-paid]")) { rpt.withUnpaid = !rpt.withUnpaid; drawReport(); }
  };
  ["rf", "rt"].forEach(id => { const el = $(id); if (el) el.onchange = () => { rpt[id === "rf" ? "from" : "to"] = el.value; drawReport(); }; });
  $("rPrint").onclick = () => print();
  $("rCsv").onclick = () => {
    const q = v => `"${String(v).replace(/"/g, '""')}"`;
    const head = ["日期", "訂單編號", "狀態", "付款", "商品", "數量", "單價", "金額", "折扣分攤", "銷售額", "金流手續費", "貨主", "我方分潤%", "我方分潤", "應付貨主"];
    const rows = r.lines.map(l => [l.date, l.orderNo, l.status, l.paid ? "已付款" : "未付款", l.name, l.qty, l.unit, l.gross, l.disc, l.net, l.pf, l.supplier || "自有", l.rate, l.fee, l.payable]);
    const csv = "\ufeff" + [head, ...rows].map(x => x.map(q).join(",")).join("\r\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], {type: "text/csv"}));
    a.download = `赤貧軍團報表_${r.from}_${r.to}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
}

    <div class="err" id="uerr"></div><div class="btns"><button class="btn ink" id="nuSave">新增帳號</button></div>`;
  box.onchange = e => { const s = e.target.closest("[data-urole]"); if (s) admin("admin_saveUser", {name: s.dataset.urole, role: s.value}).then(() => toast("已變更權限")).catch(err => { toast(err.message); drawUsers(); }); };
  box.onclick = e => {
    const d = e.target.closest("[data-udel]"); if (!d) return;
    if (d.dataset.confirm !== "1") { d.dataset.confirm = "1"; d.textContent = "確認刪除"; return; }
    busy(d, async () => { await admin("admin_deleteUser", {name: d.dataset.udel}); toast("已刪除帳號"); drawUsers(); }).catch(err => toast(err.message));
  };
  $("nuSave").onclick = e => busy(e.target, async () => {
    $("uerr").textContent = "";
    await admin("admin_saveUser", {name: $("nuName").value.trim(), pass: $("nuPass").value, role: $("nuRole").value});
    toast("已新增帳號"); drawUsers();
  }).catch(err => $("uerr").textContent = err.message);
}
let setTab = sessionStorage.getItem("cp-settab") || "shop";
function drawSettings() {
  const s = data.settings, isDefault = lsGet("cp-default-pw", "") === "1";
  if (role() !== "owner") { $("main").innerHTML = accountCard(isDefault); bindAccount(); return; }
  const st = setTab;
  $("main").innerHTML = `<div class="filters subtabs" style="margin-top:14px">${[["shop", "賣場"], ["pay", "金流"], ["line", "LINE 通知"], ["acct", "帳號"]].map(([k, n]) => `<button data-st="${k}" aria-pressed="${st === k}">${n}</button>`).join("")}</div>
    <section data-sec="shop" ${st === "shop" ? "" : "hidden"}><h2>賣場設定</h2><div class="card">
      <label class="check" style="margin-top:0"><input type="checkbox" id="sopen" ${s.ordersOpen ? "checked" : ""}>開放下單</label>
      <span class="note" style="display:block;margin:-6px 0 8px 28px">未勾選＝商品照常展示，購物車與結帳顯示「尚未開放下單」</span>
      <div class="f2"><div class="f"><label for="sf">黑貓宅配運費</label><input id="sf" type="number" inputmode="numeric" value="${s.shipFee}"></div>
        <div class="f"><label for="sc">7-11 店到店運費</label><input id="sc" type="number" inputmode="numeric" value="${s.shipFeeCvs}"></div></div>
      <div class="f"><label for="so">免運門檻</label><input id="so" type="number" inputmode="numeric" value="${s.freeShipOver || ""}" placeholder="不設"><span class="note">折扣後金額達門檻即免運（兩種寄送皆適用）</span></div>
      <div class="f"><label for="sl">LINE 聯絡網址（選填）</label><input id="sl" value="${esc(s.lineUrl)}" placeholder="https://lin.ee/…"><span class="note">訂單完成頁顯示「LINE 聯絡」按鈕</span></div>
      <label class="check"><input type="checkbox" id="sbOn" ${s.shipBarOn ? "checked" : ""}>顯示免運公告條</label>
      <div class="f"><label for="sb">免運公告文字</label><input id="sb" value="${esc(s.shipBar)}" placeholder="空白＝自動顯示「全站滿 $${Number(s.freeShipOver || 0).toLocaleString()} 免運」"><span class="note">賣場上方那一條；空白會依免運門檻自動產生</span></div>
      <div class="f"><label for="sn">賣場公告（選填）</label><input id="sn" value="${esc(s.notice)}" placeholder="例：全館滿 $2,000 免運"></div>
      <div class="err" id="serr"></div><div class="btns"><button class="btn" id="sSave">儲存設定</button></div></div>
    </section><section data-sec="pay" ${st === "pay" ? "" : "hidden"}>
    <h2>綠界金流</h2><div class="card" id="ecStatus"><div class="note">讀取中…</div></div><div class="card" id="ecCard" hidden>
      <label class="check" style="margin-top:0"><input type="checkbox" id="ecOn">啟用線上付款（信用卡、ATM 虛擬帳號）</label>
      <label class="check"><input type="checkbox" id="ecStage">測試模式（綠界測試環境，不會真的扣款）</label>
      <div class="f"><label for="ecMid">商店代號 MerchantID</label><input id="ecMid" autocomplete="off" placeholder="與欣瀚資訊同一組"></div>
      <div class="f2"><div class="f"><label for="ecKey">HashKey</label><input id="ecKey" type="password" autocomplete="new-password" placeholder="未設定"></div>
        <div class="f"><label for="ecIv">HashIV</label><input id="ecIv" type="password" autocomplete="new-password" placeholder="未設定"></div></div>
      <span class="note">金鑰只能寫入、不會顯示；留空＝不變更。綠界廠商後台 → 系統開發管理 → 系統介接設定。</span>
      <div class="err" id="ecErr"></div><div class="btns"><button class="btn ink" id="ecSave">儲存金流設定</button></div></div>
    <h2>金流手續費 <button class="btn ghost" id="fUnlock">修改</button></h2><div class="card" id="feeCard">
      <div class="f2"><div class="f"><label for="fcp">信用卡費率 %</label><input id="fcp" type="number" step="0.01" value="${s.feeCardPct}"></div>
        <div class="f"><label for="fcm">信用卡每筆最低（元）</label><input id="fcm" type="number" value="${s.feeCardMin}"></div></div>
      <div class="f2"><div class="f"><label for="fco">信用卡處理費（元）</label><input id="fco" type="number" value="${s.feeCardOrder}"></div>
        <div class="f"><label for="fap">ATM 費率 %</label><input id="fap" type="number" step="0.01" value="${s.feeAtmPct}"></div></div>
      <div class="f2"><div class="f"><label for="fam">ATM 每筆最低（元）</label><input id="fam" type="number" value="${s.feeAtmMin}"></div>
        <div class="f"><label for="fsp">手續費誰負擔（報表）</label><select id="fsp">
          <option value="ratio" ${s.feeSplit === "ratio" ? "selected" : ""}>依分潤比例分攤</option><option value="us" ${s.feeSplit === "us" ? "selected" : ""}>我方全額負擔</option><option value="owner" ${s.feeSplit === "owner" ? "selected" : ""}>貨主全額負擔</option></select></div></div>
      <span class="note">費率未稅，計算時自動加 5% 營業稅。預設為綠界一般會員公告費率；特約會員請依合約修改。</span>
      <div class="err" id="ferr"></div><div class="btns" id="fBtns" hidden><button class="btn ghost" id="fReset" style="flex:none">恢復綠界預設</button><button class="btn ink" id="fSave">儲存手續費設定</button></div></div>
    </section><section data-sec="line" ${st === "line" ? "" : "hidden"}>
    <h2>LINE 下單通知</h2><div class="card" id="lineBox"><div class="note">讀取中…</div></div>
    </section><section data-sec="acct" ${st === "acct" ? "" : "hidden"}>
    ${accountCard(isDefault)}
    <h2>帳號管理</h2><div class="card" id="usersBox"><div class="note">載入中…</div></div></section>`;
  $("main").querySelector(".subtabs").onclick = e => { const b = e.target.closest("[data-st]"); if (b) { setTab = b.dataset.st; sessionStorage.setItem("cp-settab", setTab); drawSettings(); } };
  bindAccount(); drawUsers(); if (st === "line") drawLine();
  $("sSave").onclick = e => busy(e.target, async () => {
    await admin("admin_saveSettings", {settings: {shipBarOn: $("sbOn").checked ? "TRUE" : "FALSE", shipBar: $("sb").value.trim(), ordersOpen: $("sopen").checked ? "TRUE" : "FALSE", shipFee: Number($("sf").value) || 0, shipFeeCvs: Number($("sc").value) || 0, freeShipOver: Number($("so").value) || 0, lineUrl: $("sl").value.trim(), notice: $("sn").value.trim()}});
    await loadAll(); toast("已儲存");
  }).catch(err => $("serr").textContent = err.message);
  admin("admin_ecpayStatus", {}, {tries: 2}).then(r => {
    const e = r.ecpay, live = e.enabled && !e.stage && e.keySet && e.ivSet;
    $("ecStatus").innerHTML = `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
      <div><b style="font-size:17px">${!e.enabled ? "未啟用" : live ? "已連接（正式）" : e.stage ? "已啟用（測試模式）" : "缺少金鑰"}</b>
        <span class="note" style="display:block">${e.mid ? "商店代號 " + esc(e.mid.slice(0, 3)) + "•••" + esc(e.mid.slice(-2)) : "尚未設定商店代號"}・信用卡＋ATM 虛擬帳號</span></div>
      <span class="pill ${live ? "on" : e.enabled ? "warn" : "off"}">${live ? "收款中" : e.enabled ? "測試" : "關閉"}</span></div>
      <button class="btn ghost" id="ecEdit" style="margin-top:12px;width:100%">重新設定金鑰</button>`;
    $("ecEdit").onclick = ev => { const b = ev.target; if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "確認要修改金流設定？再按一次"; return; } $("ecCard").hidden = false; b.hidden = true; };
    $("ecOn").checked = e.enabled; $("ecStage").checked = e.stage; $("ecMid").value = e.mid;
    $("ecKey").placeholder = e.keySet ? "已設定（留空不變更）" : "未設定"; $("ecIv").placeholder = e.ivSet ? "已設定（留空不變更）" : "未設定";
  }).catch(() => {});
  $("ecSave").onclick = e => busy(e.target, async () => {
    $("ecErr").textContent = "";
    if ($("ecOn").checked && !$("ecStage").checked && !$("ecMid").value.trim()) throw new Error("正式模式需填商店代號與金鑰");
    const r = await admin("admin_saveEcpay", {ecpay: {enabled: $("ecOn").checked, stage: $("ecStage").checked, mid: $("ecMid").value.trim(), key: $("ecKey").value.trim(), iv: $("ecIv").value.trim()}});
    if ($("ecOn").checked && !$("ecStage").checked && !(r.ecpay.keySet && r.ecpay.ivSet)) throw new Error("正式模式缺少 HashKey 或 HashIV");
    $("ecKey").value = $("ecIv").value = ""; toast("已儲存金流設定"); drawSettings();
  }).catch(err => $("ecErr").textContent = err.message);
  // 防誤觸（使用者 2026-11-07）：預設鎖住，按「修改」才能改；儲存要再按一次確認
  const feeIds = ["fcp", "fcm", "fco", "fap", "fam", "fsp"];
  const lockFee = on => { feeIds.forEach(id => $(id).disabled = on); $("fBtns").hidden = on; $("fUnlock").hidden = !on; };
  lockFee(true);
  $("fUnlock").onclick = () => lockFee(false);
  $("fReset").onclick = () => { [["fcp", "2.75"], ["fcm", "5"], ["fco", "1"], ["fap", "1"], ["fam", "15"], ["fsp", "ratio"]].forEach(([id, v]) => $(id).value = v); toast("已填入綠界預設，按儲存才會生效"); };
  $("fSave").onclick = e => {
    const b = e.target;
    if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "確認儲存（會影響報表拆帳）"; setTimeout(() => { b.dataset.confirm = ""; b.textContent = "儲存手續費設定"; }, 4000); return; }
    return saveFee(e);
  };
  const saveFee = e => busy(e.target, async () => {
    await admin("admin_saveSettings", {settings: {feeCardPct: $("fcp").value, feeCardMin: $("fcm").value, feeCardOrder: $("fco").value, feeAtmPct: $("fap").value, feeAtmMin: $("fam").value, feeSplit: $("fsp").value}});
    await loadAll(); toast("已儲存"); drawSettings();
  }).catch(err => $("ferr").textContent = err.message);

}

/* ── 上傳 ── */
function pickFiles(accept, multiple) {
  return new Promise(res => { const inp = $("fileIn"); inp.value = ""; inp.accept = accept; inp.multiple = !!multiple;
    inp.onchange = () => res([...inp.files]); inp.click(); });
}
const toB64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(blob); });
async function uploadFile(file) {
  const r = await admin("admin_upload", {name: file.name, mime: file.type, data: await toB64(file)}, {timeout: 300000});
  return r.src || "drive:" + r.fileId; // 影片回 media/…（存在網站上），圖片回 drive:<id>
}
// 圖片先在瀏覽器縮到最長邊 1600、轉 JPEG，上傳快、賣場載入也快
async function uploadImage(file) {
  const img = await createImageBitmap(file);
  const k = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", .86));
  return uploadFile(new File([blob], file.name.replace(/\.\w+$/, "") + ".jpg", {type: "image/jpeg"}));
}

function openModal() { $("modal").classList.add("open"); document.body.style.overflow = "hidden"; $("mPanel").scrollTop = 0; }
function closeModal() { $("modal").classList.remove("open"); document.body.style.overflow = ""; $("mPanel").onclick = $("mPanel").oninput = null; }
$("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });

async function openFromHash() {
  const m = location.hash.match(/^#order=(\w+)/); if (!m) return;
  history.replaceState(null, "", location.pathname);
  tab = "orders"; drawApp(); if (!orders) await loadOrders();
  if (orders.some(o => o.orderNo === m[1])) openOrder(m[1]);
}
/* ── 啟動 ── */
// 只有後端明確回「auth」（過期／失效）才登出；連線失敗不登出，避免 GAS 冷啟動就被踢掉
if (token) { $("app").innerHTML = '<div class="empty">載入中…</div>';
  loadAll().then(async () => { drawApp(); await openFromHash(); }).catch(e => { if (!token) return; $("app").innerHTML = `<div class="empty">${esc(e.message)}<br><br><button class="btn" data-reload>重新整理</button></div>`; }); }
else drawLogin();
document.addEventListener("click", e => { if (e.target.closest("[data-reload]")) location.reload(); });
</script>
