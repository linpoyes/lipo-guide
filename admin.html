<style>
:root{
  color-scheme:light dark;
  /* 2026-11-10 護眼調整（同賣場）：朱紅、綠降飽和；圖表改低彩度色 */
  --bg:#F5F1EA; --card:#FFFDF9; --line:#E6DED1; --text:#2A2F3A; --dim:#575D69; --faint:#7A7F89;
  --accent:#1C3F7C; --red:#C9362C; --ink:#2B2F38; --ok:#2C7A52; --warn:#A85A00; --bad:#B3261E;
  --sel:rgba(28,63,124,.10); --wash:rgba(26,33,48,.055);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15181E; --card:#1D2129; --line:#2C313B; --text:#E6E1D8; --dim:#B4AFA6; --faint:#8C8880;
    --accent:#8FB0E6; --red:#E2584D; --ink:#22262E; --ok:#66C495; --warn:#FFB650; --bad:#F08078;
    --sel:rgba(127,168,236,.17); --wash:rgba(243,236,223,.06);
  }
}
@media (prefers-color-scheme: dark){.btn.ink,.x{background:#2C313B}}
*{box-sizing:border-box}
[hidden]{display:none!important}
.f input:disabled,.f select:disabled{opacity:.6;cursor:not-allowed;border-style:dashed}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-feature-settings:"tnum"}
button{font:inherit;cursor:pointer}
button:disabled,button[aria-busy]{filter:grayscale(.6) opacity(.55);cursor:default}
.wrap{max-width:980px;margin:0 auto;padding:0 14px}
svg{width:20px;height:20px}

.top{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff}
.top .wrap{display:flex;align-items:center;gap:10px;height:54px}
.top img{width:32px;height:32px;border-radius:8px}
.top b{font-size:17px;font-weight:900;letter-spacing:.06em}
.top span{flex:1;min-width:0;color:#C9CBD2;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top a,.top button{color:#fff;background:transparent;border:1px solid #444;border-radius:8px;padding:4px 10px;font-size:13px;text-decoration:none}
.tabs{position:sticky;top:54px;z-index:9;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px}
.tabs button{flex:1 1 0;min-width:0;border:0;border-radius:10px;padding:8px 0;font-size:14px;background:var(--card);color:var(--dim);font-weight:800;white-space:nowrap}
.tabs button[aria-pressed=true]{background:var(--red);color:#fff}

h2{font-size:18px;margin:18px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.list{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;color:var(--text);width:100%}
.row img,.row .ph{flex:none;width:52px;height:52px;border-radius:9px;object-fit:cover;background:var(--wash)}
.row .info{flex:1;min-width:0}
.row .info b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .info small{display:block;color:var(--dim);font-size:13px}
.row .right{text-align:right;flex:none}
.row{min-width:0;max-width:100%}
/* 商品列表（11-08 手機吃字）：名稱最多兩行、價格庫存一行、標籤可換行 */
.row .info b.pn{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.35}
.row .info .pm .pr{color:var(--red);font-weight:900}
.ptags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.ptags i{font-style:normal;font-size:12px;font-weight:800;color:var(--dim);background:var(--wash);border-radius:6px;padding:1px 7px;white-space:nowrap}
.ptags i.w{color:var(--warn);background:rgba(168,90,0,.12)}.ptags i.r{color:#fff;background:var(--red)}
.pill{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:1px 9px;white-space:nowrap}
.pill.on{background:rgba(31,122,74,.14);color:var(--ok)} .pill.off{background:var(--wash);color:var(--faint)}
.pill.new{background:var(--red);color:#fff} .pill.warn{background:rgba(168,90,0,.14);color:var(--warn)}
.btn{border:0;border-radius:10px;background:var(--red);color:#fff;font-weight:800;padding:9px 16px;white-space:nowrap}
.btn.ink{background:var(--ink)} .btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)} .btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btns .btn{flex:1}
.empty{padding:26px;text-align:center;color:var(--faint);font-weight:700}

.f{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.f label{font-size:13px;font-weight:800;color:var(--dim)}
.f input,.f select,.f textarea{font:inherit;color:var(--text);background:var(--bg);border:1.5px solid var(--faint);border-radius:10px;padding:8px 10px;width:100%}
.f textarea{min-height:90px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--accent)}
.f2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.f2 .f{margin:0}
.f .note{font-size:12px;color:var(--faint);font-weight:600}
.check{display:flex;align-items:center;gap:8px;font-weight:800;margin:10px 0}
.check input{width:20px;height:20px;accent-color:var(--red)}

.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;background:var(--wash)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:14px;line-height:1}
.thumb .setfirst{position:absolute;left:0;right:0;bottom:0;top:auto;width:auto;height:auto;border-radius:0;background:rgba(0,0,0,.65);color:#fff;font-size:11px;font-weight:800;padding:2px 0}
.thumb .first{position:absolute;left:0;right:0;bottom:0;background:var(--red);color:#fff;font-size:11px;font-weight:800;text-align:center}
.addimg{width:76px;height:76px;border-radius:10px;border:2px dashed var(--faint);background:transparent;color:var(--dim);font-weight:800;font-size:13px}
.tierrow{display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px;align-items:center;margin-bottom:6px}
.tierrow input{font:inherit;color:var(--text);background:var(--bg);border:1.5px solid var(--faint);border-radius:10px;padding:7px 9px;width:100%;min-width:0}
.tierrow span{font-size:13px;font-weight:800;color:var(--ok);min-width:42px}
.tierrow button{border:0;background:transparent;color:var(--bad);font-size:20px;width:30px}

.login{max-width:360px;margin:12vh auto 0;text-align:center}
.login img{width:84px;height:84px;border-radius:18px}
.login h1{font-size:22px;margin:10px 0 2px;letter-spacing:.1em}
.login .card{text-align:left;margin-top:16px}
.err{color:var(--bad);font-weight:700;font-size:13px;min-height:1.3em}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;font-weight:700;padding:9px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
@media (min-width:700px){.modal.open{align-items:center}}
.modal .panel{width:100%;max-width:620px;max-height:94vh;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media (min-width:700px){.modal .panel{border-radius:18px}}
.panel h3{margin:0 0 6px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.x{width:34px;height:34px;border:0;border-radius:50%;background:var(--ink);color:#fff;font-size:18px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.capcard{margin-bottom:12px}.caphd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.caphd b{font-size:16px}
.capnum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:8px}.capnum div{background:var(--wash);border-radius:10px;padding:8px 10px}
.capnum small{display:block;font-size:12px;color:var(--dim);font-weight:700}.capnum b{font-size:18px}
.tierbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:4px 0}.tierbar i{display:block;height:100%;background:linear-gradient(90deg,#2C8A5E,#5BD69B)}
.afl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.afl input{grid-column:1/-1}.afl select,.afl input{font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.afl button{grid-column:1/-1}@media (min-width:760px){.afl{grid-template-columns:180px 160px 1fr auto}.afl input,.afl button{grid-column:auto}}
.adh{font-size:14px;color:var(--dim);margin:14px 0 6px}
.alist{padding:4px 12px}.ar{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid var(--line)}.ar:last-child{border-bottom:0}
.ar time{font-size:13px;color:var(--faint);font-weight:700;padding-top:1px;font-variant-numeric:tabular-nums}
.ar b{display:block;font-size:14px}.ar span{display:block;font-size:13px;color:var(--dim);word-break:break-all;line-height:1.5}
.ar em{font-style:normal;text-align:right;font-size:13px;font-weight:800;white-space:nowrap}.ar em small{display:block;font-size:11px;color:var(--faint);font-weight:700}
.ar.warn b{color:var(--warn)}.ar.bad b{color:var(--bad)}
.fees table.fr{min-width:640px}.fees table.fr td,.fees table.fr th{white-space:nowrap}.fees table td+td,.fees table th+th{padding-left:14px}.fees table.rt{min-width:440px}
.fees h4{margin:14px 0 6px;font-size:14px;color:var(--dim)}.fees .rgrid i{display:block;font-style:normal;font-size:11px;color:var(--faint);font-weight:700;margin-top:2px}
.fees .estm,.fees td small{display:block;font-size:11px;color:var(--warn);font-weight:700}.fees .fr td small{color:var(--faint)}.fees .fr td:nth-child(3) small{color:var(--warn)}
.rolec{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.rolec button{border:1.5px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:10px 12px;text-align:left}
.rolec button b{display:block;font-size:15px}.rolec button small{display:block;font-size:12px;color:var(--faint);font-weight:600;margin-top:2px;line-height:1.4}
.rolec button[aria-pressed=true]{border-color:var(--red);background:rgba(215,38,30,.08)}.rolec button[aria-pressed=true] b{color:var(--red)}
.pdet{margin:4px 0 10px;border:1px solid var(--line);border-radius:10px;padding:8px 12px}.pdet>summary{cursor:pointer;font-weight:800;font-size:14px;color:var(--dim)}
.pdet[open]>summary{margin-bottom:8px}
.lineb{background:#06C755!important;color:#fff!important;border:0!important;display:inline-flex;align-items:center;justify-content:center;gap:8px}.lineb svg{width:20px;height:20px}
.lor{display:flex;align-items:center;gap:10px;margin:12px 0;color:var(--faint);font-size:12px}.lor::before,.lor::after{content:"";flex:1;height:1px;background:var(--line)}
.lav{width:36px;height:36px;border-radius:50%;flex:none}.ucard summary{gap:10px}.ucard summary>span:not(.pill){flex:1;min-width:0}.ucard summary>.pill{flex:none;align-self:flex-start;margin-top:2px}
.lbind{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}.lbind .btn{height:40px;flex:none}.invout{flex-basis:100%}.invout input{width:100%;font-size:13px;padding:8px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
.tabs button{font-size:13px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:8px 10px;font-weight:800;font-size:15px;text-align:left}
.seg button small{display:block;font-size:12px;font-weight:600;color:var(--faint);margin-top:2px}
.seg button[aria-pressed=true]{border-color:var(--red);background:rgba(215,38,30,.08)}
.splitprev{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:2px 0 10px}.splitprev:empty{display:none}
.splitprev div{background:var(--wash);border-radius:10px;padding:8px 12px}.splitprev span{display:block;font-size:12px;color:var(--dim);font-weight:700}.splitprev b{font-size:20px}
.splitprev small{grid-column:1/-1;font-size:12px;color:var(--faint);line-height:1.5}
.ph4{margin:16px 0 8px;font-size:15px;border-top:1px solid var(--line);padding-top:14px}
.dims{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.dims .f{margin-bottom:8px}
.packres{display:grid;gap:6px;margin-bottom:10px}.packres div{display:flex;justify-content:space-between;gap:10px;border-radius:10px;padding:8px 12px;font-size:14px}
.packres .ok{background:rgba(31,122,74,.12)}.packres .ok b{color:var(--ok)}.packres .no{background:rgba(179,38,30,.1)}.packres .no b{color:var(--bad)}.packres span{text-align:right;font-weight:700}
.shipq{display:flex;align-items:center;gap:12px;margin-bottom:10px;border-color:#06C755}
.shipq div{flex:1;min-width:0}.shipq b{display:block;font-size:16px}.shipq small{color:var(--faint);font-size:12px;font-weight:700}
.shipq .btn{flex:none}
.subtabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.filters button{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--dim);border-radius:999px;padding:4px 12px;font-weight:800;font-size:13px}
.filters button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.otable{width:100%;border-collapse:collapse;margin:8px 0;font-size:14px}
.otable td{padding:5px 0;border-bottom:1px solid var(--line)}
.otable td:last-child{text-align:right}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--dim);font-weight:700} .kv dd{margin:0}
.statusbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:12px}
.statusbar button{border:1.5px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:8px 0;font-weight:800;font-size:13px}
.statusbar button[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
.ship{margin-top:12px;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.ship .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--ink);color:#fff;padding:8px 12px;font-weight:800}
.ship .hd button{border:0;border-radius:8px;background:var(--red);color:#fff;font-weight:800;padding:5px 12px;font-size:13px}
.ship.logi{border-color:#06C755}.ship.logi .hd{background:#0B6E3A}.ship.logi .note{padding:4px 12px 0;margin:0!important;font-size:12px}.ship.logi .btns{padding:10px 12px 12px;margin:0!important}
.ship .cp{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:0;border-top:1px solid var(--line);background:var(--bg);color:var(--text);text-align:left}
.ship .cp:first-of-type{border-top:0}
.ship .cp span{flex:none;width:64px;font-size:13px;font-weight:800;color:var(--dim)}
.ship .cp b{flex:1;min-width:0;font-weight:700;word-break:break-all}
.ship .cp i{flex:none;font-style:normal;font-size:12px;font-weight:800;color:var(--accent)}
.ship .cp.done i{color:var(--ok)}
.pwwarn{display:block;width:100%;margin-top:10px;border:0;border-radius:10px;background:var(--red);color:#fff;font-weight:800;padding:9px 12px;text-align:left}
/* 儀表板 */
.live{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:800;margin:4px 0 10px}
.live i{width:9px;height:9px;border-radius:50%;background:#2C8A5E;box-shadow:0 0 0 0 rgba(31,157,99,.6);animation:livep 1.8s infinite}
.live span{color:var(--faint);font-size:13px;font-weight:700;margin-left:auto}
@keyframes livep{70%{box-shadow:0 0 0 8px rgba(31,157,99,0)}100%{box-shadow:0 0 0 0 rgba(31,157,99,0)}}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px}
.kc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;position:relative}
.kc small{display:block;color:var(--dim);font-size:12px;font-weight:800}
.kc b{display:block;font-size:24px;font-weight:900;line-height:1.25;margin-top:2px}
.kc em{position:absolute;top:11px;right:12px;font-style:normal;font-size:12px;font-weight:900;border-radius:999px;padding:1px 8px}
.kc em.up{color:var(--ok);background:rgba(31,122,74,.12)}.kc em.down{color:var(--bad);background:rgba(179,38,30,.1)}.kc em.flat{color:var(--faint);background:var(--wash)}
.kc span{display:block;color:var(--faint);font-size:12px;font-weight:700;margin-top:2px}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.dc{margin:0}.dc h3{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px;font-size:16px}
.dc h4{margin:14px 0 8px;font-size:14px;color:var(--dim)}
.chart{width:100%;height:auto;display:block;max-width:100%}.chart .gl{stroke:var(--line);stroke-width:1}.chart .ax,.donut .ax{fill:var(--faint);font-size:11px;font-weight:700}
.lg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}.lg i{width:10px;height:10px;border-radius:3px;margin-left:6px}
.hb,.fun{display:grid;gap:8px}
.hbr,.fr{display:grid;grid-template-columns:78px minmax(0,1fr) 74px;align-items:center;gap:8px;font-size:13px;font-weight:700}
.hbr span,.fr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbr i,.fr i{height:12px;border-radius:6px;background:var(--wash);overflow:hidden}.hbr b,.fr b{display:block;height:100%;border-radius:6px}
.fr i{height:20px}.fr b{background:linear-gradient(90deg,#C9362C,#D9774E)}
.hbr em,.fr em{font-style:normal;text-align:right;font-weight:900}.hbr small,.fr small{display:block;color:var(--faint);font-size:11px}
.donut{display:flex;align-items:center;gap:14px}.donut svg{width:120px;height:120px;flex:none}.donut .dn{fill:var(--text);font-size:15px;font-weight:900}
.donut p{display:flex;align-items:center;gap:6px;margin:4px 0;font-size:13px;font-weight:700}.donut p i{width:10px;height:10px;border-radius:3px}.donut p b{margin-left:auto;padding-left:10px}
.heat{display:grid;gap:3px;overflow-x:auto}.hrow{display:grid;grid-template-columns:18px repeat(24,minmax(9px,1fr));gap:3px;align-items:center}
.hrow span{font-size:11px;color:var(--faint);font-weight:800}.hrow i{aspect-ratio:1;border-radius:3px;background:var(--line);opacity:.9}
.hx i{background:none!important;font-size:10px;color:var(--faint);font-style:normal;aspect-ratio:auto;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{display:inline-flex;gap:6px;align-items:center;background:var(--wash);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700}
.chips b{color:var(--red)}.chips.warn span{background:rgba(168,90,0,.12)}
.dt td:not(:first-child),.dt th:not(:first-child){text-align:right;white-space:nowrap}

.rcard{margin-bottom:12px}

@media (min-width:640px){.rgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* 2026-11-08：iPhone 點到小於 16px 的輸入框會自動放大，放大後整頁可以左右滑——輸入框一律 16px；

html{touch-action:manipulation}

<body>
<div id="app"></div>
<div class="modal" id="modal"><div class="panel" id="mPanel"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" hidden>

<script src="shop-core.js?v=202611102344"></script>
<script>
const $ = id => document.getElementById(id);
// 登入存在 localStorage，10 天內同一台裝置不用重新登入（到期由後端判斷）
let token = lsGet("cp-admin", "") || "";
// 分級權限：分頁依角色顯示（後端也會擋，這裡只是不顯示用不到的）
const TABS = [["dash", "儀表板"], ["orders", "訂單"], ["products", "商品"], ["videos", "影片"], ["codes", "折扣碼"], ["report", "報表"], ["audit", "紀錄"], ["settings", "設定"]];
const ROLE_NAME = {owner: "超級管理員", staff: "營運", shipper: "出貨", viewer: "報表", custom: "自訂", customer: "顧客", system: "系統"};
const role = () => (data && data.me && data.me.role) || "owner";
// 權限（後端 PERMS 為準）：超級管理員全部；其他帳號看 data.me.perms
const has = p => role() === "owner" || ((data && data.me && data.me.perms) || []).includes(p);
const TAB_PERM = {dash: "dash", orders: "orders", products: "products", videos: "videos", codes: "codes", report: "report"};
const myTabs = () => TABS.map(t => t[0]).filter(k => k === "audit" ? role() === "owner" : !TAB_PERM[k] || has(TAB_PERM[k]));
let data = null, orders = null, tab = sessionStorage.getItem("cp-tab") || "dash", orderFilter = "新訂單";
const STATUSES = ["新訂單", "已確認", "已出貨", "已完成", "已取消"];

function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 2200); }
async function admin(action, body = {}, opts) {
  try { return await api({action, token, ...body}, opts); }
  catch (e) { if (e.message === "auth") { logout(); throw new Error("登入已逾時，請重新登入"); } throw e; }
}
function logout() { token = ""; lsSet("cp-admin", ""); drawLogin(); }

/* ── 登入 ── */
function drawLogin() {
  $("app").innerHTML = `<div class="wrap login"><img src="badge.png?v=1" alt=""><h1>管理後台</h1><div style="color:var(--dim);font-weight:700">赤貧軍團</div>
    <form class="card" id="loginForm">
      <div class="f"><label for="lu">帳號</label><input id="lu" name="username" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required value="${esc(lsGet("cp-admin-user", ""))}"></div>
      <div class="f"><label for="lp">密碼</label><input id="lp" name="password" type="password" autocomplete="current-password" required></div>
      <label class="check" style="margin-top:0"><input type="checkbox" id="lrem" ${lsGet("cp-admin-rem", true) ? "checked" : ""}>記住帳號</label>
      <div class="err" id="lerr"></div>
      <button class="btn" style="width:100%" id="lbtn">登入</button>
      <div class="lor"><span>或</span></div>
      <button type="button" class="btn lineb" id="lline" style="width:100%"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3C6.5 3 2 6.6 2 11c0 3.9 3.5 7.2 8.3 7.9.3.1.8.2.9.5.1.3.1.7 0 1l-.1.9c0 .3-.2 1 .9.5s5.9-3.5 8.1-6C21.4 14.2 22 12.7 22 11c0-4.4-4.5-8-10-8z"/></svg>LINE 登入</button>
    </form><p><a href="shop.html" style="color:var(--dim);font-size:13px">返回賣場</a></p></div>`;
  $("lline").onclick = () => adminLineGo("");
  $("loginForm").onsubmit = e => {
    e.preventDefault();
    busy($("lbtn"), async () => {
      $("lerr").textContent = "";
      try {
        // 全形轉半形：中文輸入法常打出「０１」，看起來一樣但比對不過（2026-10-31 使用者登不進去的原因）
        const half = v => v.normalize("NFKC").trim();
        const r = await api({action: "login", user: half($("lu").value), pass: half($("lp").value)});
        token = r.token; lsSet("cp-admin", token);
        // 記住帳號（11-08 使用者）：只存帳號名稱；密碼交給瀏覽器的密碼管理（支援的瀏覽器會詢問是否儲存）
        lsSet("cp-admin-rem", $("lrem").checked); lsSet("cp-admin-user", $("lrem").checked ? half($("lu").value) : "");
        try { if (window.PasswordCredential) navigator.credentials.store(new PasswordCredential({id: half($("lu").value), password: $("lp").value})); } catch (e) {}
        lsSet("cp-default-pw", r.isDefault ? "1" : "");
        await loadAll(); drawApp(); await openFromHash();
      } catch (err) { $("lerr").textContent = err.message; }
    });
  };
}

/* ── 主畫面 ── */
async function loadAll() { data = await admin("admin_all", {}, {tries: 3}); lsSet("cp-notrack", 1); }
async function loadOrders() { orders = (await admin("admin_orders", {}, {tries: 3})).orders; }

function drawApp() {
  if (!myTabs().includes(tab)) tab = myTabs()[0];
  $("app").innerHTML = `<header class="top"><div class="wrap"><img src="badge.png?v=1" alt=""><b>赤貧軍團</b><span>${esc(data.me ? data.me.user : "")}・${ROLE_NAME[role()]}</span>
      <a href="shop.html" target="_blank" rel="noopener">賣場</a><button id="outBtn">登出</button></div></header>
    <nav class="tabs"><div class="wrap">
      ${TABS.filter(([k]) => myTabs().includes(k))
        .map(([k, n]) => `<button data-tab="${k}" aria-pressed="${tab === k}">${n}</button>`).join("")}</div></nav>
    ${lsGet("cp-default-pw", "") === "1" && role() === "owner" ? '<div class="wrap"><button class="pwwarn" data-gopw>目前為初始密碼，任何人都可能登入，請立即變更 ›</button></div>' : ""}
    <main class="wrap" id="main"></main>`;
  $("outBtn").onclick = logout;
  const gp = document.querySelector("[data-gopw]"); if (gp) gp.onclick = () => { tab = "settings"; sessionStorage.setItem("cp-tab", tab); drawApp(); };
  document.querySelector(".tabs").onclick = e => { const b = e.target.closest("[data-tab]"); if (b) { tab = b.dataset.tab; sessionStorage.setItem("cp-tab", tab); drawApp(); } };
  ({audit: () => { $("main").innerHTML = '<h2>操作紀錄</h2><div id="auditBox"><div class="card note">載入中…</div></div>'; drawAudit(); }, dash: drawDash, orders: drawOrders, products: drawProducts, videos: drawVideos, codes: drawCodes, report: drawReport, settings: drawSettings})[tab]();
}


/* ── 儀表板（2026-11-08）：流量、轉換、會員。彙總都在後端 dashboard_ 算好，這裡只畫圖（純 SVG，不載外部套件） ── */
let dashDays = Number(sessionStorage.getItem("cp-dash-days")) || 7, dashData = null;
const pct = (a, b) => b ? Math.round(a / b * 1000) / 10 : 0;
function delta(cur, prev, inverse) {
  if (prev === undefined || prev === null) return "";
  if (!prev) return cur ? '<em class="up">新</em>' : "";
  const d = Math.round((cur - prev) / prev * 100); if (!d) return '<em class="flat">持平</em>';
  const good = inverse ? d < 0 : d > 0;
  return `<em class="${good ? "up" : "down"}">${d > 0 ? "▲" : "▼"} ${Math.abs(d)}%</em>`;
}
// 圖表寬度跟著版面走（1:1 顯示，字不會被放大縮小）
const chartW = () => Math.max(300, Math.min(1100, (($("main") || {}).clientWidth || 640) - (innerWidth >= 760 ? 60 : 30)));
function lineChart(series, keys, colors, fmt) {
  const W = chartW(), H = 210, P = {l: 34, r: 8, t: 12, b: 24}, n = series.length;
  const max = Math.max(1, ...series.flatMap(s => keys.map(k => s[k])));
  const nice = Math.pow(10, Math.floor(Math.log10(max))), top = Math.max(4, Math.ceil(max / nice) * nice);
  const x = i => P.l + (n === 1 ? (W - P.l - P.r) / 2 : i * (W - P.l - P.r) / (n - 1)), y = v => P.t + (1 - v / top) * (H - P.t - P.b);
  const grid = [0, .25, .5, .75, 1].map(f => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(top * f)}" y2="${y(top * f)}" class="gl"/><text x="${P.l - 6}" y="${y(top * f) + 4}" text-anchor="end" class="ax">${fmt ? fmt(top * f) : Math.round(top * f)}</text>`).join("");
  const every = Math.ceil(n / 8);
  const xl = series.map((s, i) => i % every === 0 || i === n - 1 ? `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" class="ax">${esc(s.k)}</text>` : "").join("");
  const paths = keys.map((k, j) => {
    const pts = series.map((s, i) => `${x(i).toFixed(1)},${y(s[k]).toFixed(1)}`);
    const area = j === 0 ? `<path d="M${pts[0]} L${pts.join(" L")} L${x(n - 1)},${y(0)} L${x(0)},${y(0)}Z" fill="${colors[j]}" opacity=".14"/>` : "";
    return area + `<polyline points="${pts.join(" ")}" fill="none" stroke="${colors[j]}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>` +
      series.map((s, i) => `<circle cx="${x(i)}" cy="${y(s[k])}" r="${n > 31 ? 0 : 3}" fill="${colors[j]}"><title>${esc(s.k)}　${s[k]}</title></circle>`).join("");
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img">${grid}${xl}${paths}</svg>`;
}
function barChart(series, k, color, fmt) {
  const W = chartW(), H = 190, P = {l: 44, r: 8, t: 12, b: 24}, n = series.length;
  const max = Math.max(1000, ...series.map(s => s[k])), bw = (W - P.l - P.r) / n;
  const y = v => P.t + (1 - v / max) * (H - P.t - P.b), every = Math.ceil(n / 8);
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img">
    <line x1="${P.l}" x2="${W - P.r}" y1="${y(0)}" y2="${y(0)}" class="gl"/><text x="${P.l - 6}" y="${y(max) + 4}" text-anchor="end" class="ax">${fmt(max)}</text>
    ${series.map((s, i) => `<rect x="${P.l + i * bw + bw * .18}" y="${y(s[k])}" width="${bw * .64}" height="${Math.max(0, y(0) - y(s[k]))}" rx="3" fill="${color}"><title>${esc(s.k)}　${fmt(s[k])}</title></rect>` +
      (i % every === 0 || i === n - 1 ? `<text x="${P.l + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle" class="ax">${esc(s.k)}</text>` : "")).join("")}</svg>`;
}
function hbars(list, unit = "", color = "var(--accent)") {
  if (!list.length) return '<div class="note">尚無資料</div>';
  const tot = list.reduce((a, x) => a + x[1], 0), max = Math.max(...list.map(x => x[1]));
  return `<div class="hb">${list.map(([k, v]) => `<div class="hbr"><span>${esc(k)}</span><i><b style="width:${v / max * 100}%;background:${color}"></b></i><em>${v.toLocaleString()}${unit}<small>${pct(v, tot)}%</small></em></div>`).join("")}</div>`;
}
function donut(list) {
  if (!list.length) return '<div class="note">尚無資料</div>';
  const tot = list.reduce((a, x) => a + x[1], 0), C = 2 * Math.PI * 38, cols = ["#C9362C", "#4A6FB5", "#2C8A5E", "#C98A2A", "#7A64B8", "#888"];
  let off = 0;
  const arcs = list.map(([k, v], i) => { const len = v / tot * C, a = `<circle r="38" cx="50" cy="50" fill="none" stroke="${cols[i % 6]}" stroke-width="16" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 50 50)"><title>${esc(k)} ${v}</title></circle>`; off += len; return a; }).join("");
  return `<div class="donut"><svg viewBox="0 0 100 100" width="120" height="120">${arcs}<text x="50" y="48" text-anchor="middle" class="dn">${tot.toLocaleString()}</text><text x="50" y="62" text-anchor="middle" class="ax">工作階段</text></svg>
    <div>${list.map(([k, v], i) => `<p><i style="background:${cols[i % 6]}"></i>${esc(k)}<b>${pct(v, tot)}%</b></p>`).join("")}</div></div>`;
}
function heatmap(h) {
  const max = Math.max(1, ...h.flat()), days = ["日", "一", "二", "三", "四", "五", "六"];
  return `<div class="heat"><div class="hrow hx"><span></span>${Array.from({length: 24}, (_, i) => `<i>${i % 3 === 0 ? i : ""}</i>`).join("")}</div>
    ${[1, 2, 3, 4, 5, 6, 0].map(d => `<div class="hrow"><span>${days[d]}</span>${h[d].map((v, i) => `<i ${v ? `style="background:rgba(215,38,30,${.15 + v / max * .85})"` : ""} title="週${days[d]} ${i}:00　${v} 次瀏覽"></i>`).join("")}</div>`).join("")}</div>`;
}
async function drawDash() {
  const main = $("main");
  main.innerHTML = `<h2>儀表板 <button class="btn ghost" id="dReload">重新整理</button></h2>
    <div class="filters">${[[1, "今日"], [7, "近 7 天"], [30, "近 30 天"], [90, "近 90 天"]].map(([k, n]) => `<button data-d="${k}" aria-pressed="${dashDays === k}">${n}</button>`).join("")}</div>
    <div id="dBody">${dashData && dashData.days === dashDays ? "" : '<div class="empty">統計中…</div>'}</div>`;
  main.querySelector(".filters").onclick = e => { const b = e.target.closest("[data-d]"); if (b) { dashDays = Number(b.dataset.d); sessionStorage.setItem("cp-dash-days", dashDays); dashData = null; drawDash(); } };
  $("dReload").onclick = e => busy(e.target, async () => { dashData = null; await drawDash(); });
  if (!dashData || dashData.days !== dashDays) {
    try { dashData = await admin("admin_dashboard", {days: dashDays}, {tries: 2, timeout: 90000}); }
    catch (err) { if ($("dBody")) $("dBody").innerHTML = `<div class="empty">${esc(err.message)}</div>`; return; }
  }
  if (!$("dBody")) return;
  const d = dashData, K = d.kpi, P = d.prev, cmp = d.days === 1 ? "較昨日" : `較前 ${d.days} 天`;
  const card = (label, val, dl, sub) => `<div class="kc"><small>${label}</small><b>${val}</b>${dl || ""}${sub ? `<span>${sub}</span>` : ""}</div>`;
  const f0 = d.funnel[0][1] || 1;
  $("dBody").innerHTML = `
    <div class="live"><i></i>目前線上 <b>${K.online}</b> 人<span>${esc(d.from)} ～ ${esc(d.to)}・${cmp}</span></div>
    <div class="kpis">
      ${card("訪客數", K.visitors.toLocaleString(), delta(K.visitors, P.visitors), `新訪客 ${K.newVisitors}・回訪 ${Math.max(0, K.visitors - K.newVisitors)}`)}
      ${card("瀏覽次數", K.views.toLocaleString(), delta(K.views, P.views), `每次造訪 ${K.ppv} 頁`)}
      ${card("工作階段", K.sessions.toLocaleString(), delta(K.sessions, P.sessions), `跳出率 ${K.bounce}%`)}
      ${card("商品瀏覽", K.productViews.toLocaleString(), delta(K.productViews, P.productViews), `加入購物車 ${K.carts} 次`)}
      ${card("訂單", K.orders, delta(K.orders, P.orders), `已付款 ${K.paidOrders} 筆`)}
      ${card("營業額（已付款）", money(K.revenue), delta(K.revenue, P.revenue), `客單價 ${money(K.aov)}`)}
      ${card("轉換率", K.conv + "%", delta(K.conv, P.conv), "訂單 ÷ 訪客")}
      ${card("LINE 會員", K.members, delta(K.newMembers, P.newMembers), `本期新增 ${K.newMembers}・好友 ${K.friends}`)}
    </div>
    <div class="dgrid">
      <div class="card dc wide"><h3>流量走勢 <span class="lg"><i style="background:#C9362C"></i>訪客<i style="background:#4A6FB5"></i>瀏覽</span></h3>${lineChart(d.series, ["visitors", "views"], ["#C9362C", "#4A6FB5"])}</div>
      <div class="card dc wide"><h3>營業額走勢</h3>${barChart(d.series, "revenue", "#2C8A5E", v => v >= 10000 ? Math.round(v / 1000) + "k" : "$" + Math.round(v))}</div>

/* ── 訂單 ── */
async function drawOrders() {
  const main = $("main");
  if (!orders) { main.innerHTML = '<div class="empty">載入訂單中…</div>'; try { await loadOrders(); } catch (e) { main.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; } }
  if (!document.body.contains(main)) return; // 載入期間切到別的分頁：畫面已換掉，不再畫
  const today = new Date().toLocaleDateString("sv-SE", {timeZone: "Asia/Taipei"});
  const valid = orders.filter(o => o.status !== "已取消");
  const todayOrders = valid.filter(o => o.createdAt.startsWith(today));
  const list = orderFilter === "全部" ? orders : orders.filter(o => o.status === orderFilter);
  main.innerHTML = `<h2>訂單 <button class="btn ghost" id="reload">重新整理</button></h2>
    <div class="stats"><div><small>待處理</small><b>${orders.filter(o => o.status === "新訂單").length}</b></div>
      <div><small>今日訂單</small><b>${todayOrders.length}</b></div><div><small>今日營業額</small><b>${money(todayOrders.reduce((s, o) => s + o.total, 0))}</b></div></div>
    ${(() => { const pend = orders.filter(o => (o.status === "新訂單" || o.status === "已確認") && o.payStatus === "paid" && (o.shipments || []).length); return has("ship") && pend.length ?
      `<div class="card shipq"><div><b>待寄件 ${pend.length} 筆</b><small>${pend.reduce((a, o) => a + o.shipments.length, 0)} 件寄件單已建立，可一次列印</small></div><button class="btn ink" data-pall>批次列印託運單</button></div>` : ""; })()}
    <div class="filters">${["新訂單", "已確認", "已出貨", "已完成", "已取消", "全部"].map(s => `<button data-f="${s}" aria-pressed="${orderFilter === s}">${s} ${s === "全部" ? orders.length : orders.filter(o => o.status === s).length}</button>`).join("")}</div>
    <div class="list">${list.length ? list.map(o => `<button class="row" data-o="${esc(o.orderNo)}">
      <div class="info"><b>${esc(o.name)}　${esc(o.phone)}</b><small>${esc(o.orderNo)}</small><small>${esc(o.createdAt.slice(5).replace("-", "/"))}・${esc(o.shipMethod)}${o.payStatus === "paid" ? "" : `・<span style="color:var(--warn)">${o.payStatus === "awaiting" ? "待付款" : o.payStatus === "failed" ? "付款失敗" : "未付款"}</span>`}</small></div>
      <div class="right"><b>${money(o.total)}</b><br><span class="pill ${o.status === "新訂單" ? "new" : o.status === "已取消" ? "off" : "on"}">${esc(o.status)}</span></div></button>`).join("") : '<div class="empty">尚無訂單</div>'}</div>`;
  $("reload").onclick = e => busy(e.target, async () => { await loadOrders(); drawOrders(); });
  main.querySelector(".filters").onclick = e => { const b = e.target.closest("[data-f]"); if (b) { orderFilter = b.dataset.f; drawOrders(); } };
  main.querySelector(".list").onclick = e => { const b = e.target.closest("[data-o]"); if (b) openOrder(b.dataset.o); };
  const pa = main.querySelector("[data-pall]");
  if (pa) pa.onclick = () => { // 交貨便與黑貓是不同列印頁：各開一個分頁（先開空白頁再送表單，避免被擋）
    const pend = orders.filter(o => (o.status === "新訂單" || o.status === "已確認") && o.payStatus === "paid" && (o.shipments || []).length);
    const kinds = new Set(pend.flatMap(o => o.shipments.map(x => x.sub + (x.stage ? "_t" : ""))));
    const wins = [...kinds].map((k, i) => { const nm = "lpb" + Date.now() + i; return window.open("", nm) ? nm : "_blank"; });
    busy(pa, async () => {
      const r = await admin("admin_logiPrintBatch", {orderNos: pend.map(o => o.orderNo)});
      r.forms.forEach((f, i) => postForm(f, wins[i] || "_blank"));
      toast(r.forms.map(f => `${f.kind} ${f.count} 件`).join("、"));
    }).catch(err => toast(err.message));
  };
}
/* 寄件資料：每一欄點一下就複製，貼進黑貓宅急便／7-11 交貨便的對應欄位 */
function shipFields(o) {
  const goods = o.items.map(i => (i.name.replace(/^.*?[｜|]\s*/, "") || i.name) + (i.qty > 1 ? "×" + i.qty : "")).join("、");
  const name = goods.length > 30 ? goods.slice(0, 29) + "…" : goods; // 品名欄位短，過長截斷
  if (o.shipMethod.startsWith("7-11")) {
    const m = o.address.match(/^7-11 (.+?)門市（店號 (\w*)）(.*)$/) || [];
    return [["收件人", o.name], ["手機", o.phone], ["門市", m[1] ? m[1] + "門市" : o.address], ["店號", m[2] || ""], ["包裹數", `${o.packages || 1} 個交貨便`], ["品名", name]];
  }
  const m = o.address.match(/^(\d{3})(.*)$/) || [];
  return [["收件人", o.name], ["手機", o.phone], ["郵遞區號", m[1] || ""], ["地址", m[2] || o.address], ["包裹數", `${o.packages || 1} 箱宅急便`], ["品名", name], ["備註", o.note]];
}
// 綠界寄件單：交貨便代號（到 7-11 寄件時報給店員或用 ibon）／黑貓託運單號，可直接列印託運單
function logiBlock(o) {
  const list = o.shipments || [], cvs = o.shipMethod.startsWith("7-11");
  if (!data.settings.logiOn || data.settings.logiOn === "FALSE") return "";
  if (!list.length) return `<button class="btn ink" data-logi style="width:100%;margin-top:12px">建立綠界寄件單（${cvs ? "7-11 交貨便" : "黑貓宅急便"}・${o.packages || 1} 件）</button>`;
  return `<div class="ship logi"><div class="hd"><span>${cvs ? "7-11 交貨便代號" : "黑貓託運單號"}${list[0].stage ? "（測試）" : ""}</span></div>
    ${list.map((s, i) => `<button class="cp" data-cp="${esc(s.no)}"><span>${list.length > 1 ? "第 " + (i + 1) + " 件" : "單號"}</span><b>${esc(s.no)}</b><i>複製</i></button><div class="note">${esc(s.st || "")}${s.upd ? "・" + esc(s.upd) : ""}</div>`).join("")}
    <div class="btns" style="margin-top:6px"><button class="btn ghost" data-logi="again" style="flex:none">重新建單</button><button class="btn ink" data-lprint>列印託運單</button></div></div>`;
}
function shipBlock(o) {
  const f = shipFields(o).filter(([, v]) => v);
  return `<div class="ship"><div class="hd"><span>${o.shipMethod.startsWith("7-11") ? "7-11 交貨便" : "黑貓寄件"}資料</span><button data-cpall>全部複製</button></div>
    ${f.map(([k, v]) => `<button class="cp" data-cp="${esc(v)}"><span>${k}</span><b>${esc(v)}</b><i>複製</i></button>`).join("")}</div>`;
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); }
  catch (e) { const a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); document.execCommand("copy"); a.remove(); }
}
/* 出貨單（A4／可直接貼箱）：收件資料大字、品項勾選欄、包裹數；用隱藏 iframe 列印，不跳新視窗 */
function printSlip(o) {
  const cvs = o.shipMethod.startsWith("7-11"), f = shipFields(o);
  const html = `<!doctype html><meta charset="utf-8"><title>${esc(o.orderNo)}</title><style>
    @page{size:A4;margin:14mm}body{font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;color:#000}
    .hd{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #000;padding-bottom:8px}
    .hd b{font-size:26px;letter-spacing:.1em}.no{font-size:22px;font-weight:900;letter-spacing:.06em}
    .to{border:3px solid #000;border-radius:10px;padding:14px 18px;margin:16px 0}
    .to .k{font-size:14px;color:#555}.to .v{font-size:24px;font-weight:800;margin-bottom:8px;word-break:break-all}
    .ship{display:inline-block;background:#000;color:#fff;font-weight:900;font-size:20px;padding:4px 14px;border-radius:6px}
    table{width:100%;border-collapse:collapse;margin-top:10px;font-size:17px}th,td{border:1.5px solid #000;padding:8px 10px;text-align:left}
    th{background:#eee}td.c{width:60px;text-align:center}.foot{margin-top:18px;font-size:14px;color:#333}</style>
    <div class="hd"><b>赤貧軍團　出貨單</b><span class="no">${esc(o.orderNo)}</span></div>
    <p><span class="ship">${esc(o.shipMethod)}・${o.packages || 1} ${cvs ? "個交貨便" : "箱宅急便"}</span>　下單 ${esc(o.createdAt)}　${o.payStatus === "paid" ? "已付款" : "未付款"}</p>
    <div class="to">${f.filter(([k]) => !["品名", "包裹數"].includes(k)).map(([k, v]) => v ? `<div class="k">${k}</div><div class="v">${esc(v)}</div>` : "").join("")}</div>
    <table><tr><th>品項</th><th>數量</th><th>撿貨</th></tr>${o.items.map(i => `<tr><td>${esc(i.name)}</td><td class="c">${i.qty}</td><td class="c">□</td></tr>`).join("")}</table>
    <div class="foot">應收金額 ${money(o.total)}（運費 ${o.shipping ? money(o.shipping) : "免運"}）</div>`;
  const fr = document.createElement("iframe"); fr.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0";
  document.body.appendChild(fr); fr.contentDocument.open(); fr.contentDocument.write(html); fr.contentDocument.close();
  setTimeout(() => { fr.contentWindow.focus(); fr.contentWindow.print(); setTimeout(() => fr.remove(), 2000); }, 300);
}
function openOrder(no) {
  const o = orders.find(x => x.orderNo === no);
  $("mPanel").innerHTML = `<h3>${esc(o.orderNo)}<button class="x" data-x>×</button></h3>
    <dl class="kv"><dt>下單時間</dt><dd>${esc(o.createdAt)}</dd><dt>姓名</dt><dd>${esc(o.name)}</dd>
      <dt>手機</dt><dd><a href="tel:${esc(o.phone)}">${esc(o.phone)}</a></dd>${o.line ? `<dt>LINE</dt><dd>${esc(o.line)}</dd>` : ""}
      <dt>寄送</dt><dd>${esc(o.shipMethod)}${o.address ? `　${esc(o.address)}` : ""}</dd>${o.note ? `<dt>備註</dt><dd>${esc(o.note)}</dd>` : ""}
      <dt>付款</dt><dd>${o.payStatus === "paid" ? "已付款" : o.payStatus === "awaiting" ? "待付款" : o.payStatus === "failed" ? "付款失敗" : "未付款"}${o.payMethod ? `（${/^Credit/.test(o.payMethod) ? "信用卡" : /^ATM/.test(o.payMethod) ? "ATM 轉帳" : esc(o.payMethod)}）` : ""}${o.paidAt ? `　${esc(o.paidAt)}` : ""}</dd>
      ${o.payFee ? `<dt>金流手續費</dt><dd>${money(o.payFee)}${o.feeSrc === "ecpay" ? "（綠界實扣）" : "（估算）"}</dd>` : ""}
      ${o.vaAccount ? `<dt>虛擬帳號</dt><dd>${esc(o.vaBank)}－${esc(o.vaAccount)}（期限 ${esc(o.vaExpire)}）</dd>` : ""}</dl>
    <table class="otable">${o.items.map(i => `<tr><td>${esc(i.name.replace(/^.*?[｜|]\s*/, "") || i.name)}<br><small style="color:var(--dim)">${money(i.unit)} × ${i.qty}</small></td><td>${money(i.total)}</td></tr>`).join("")}
      ${o.tierSaving ? `<tr><td>多件優惠（已含於單價）</td><td>−${money(o.tierSaving)}</td></tr>` : ""}
      ${o.codeDiscount ? `<tr><td>折扣碼 ${esc(o.code)}</td><td>−${money(o.codeDiscount)}</td></tr>` : ""}
      ${o.pointsUsed ? `<tr><td>積分折抵 ${o.pointsUsed} 點</td><td>−${money(o.pointsUsed)}</td></tr>` : ""}
      <tr><td>運費（${o.packages || 1} 個包裹）</td><td>${o.shipping ? money(o.shipping) : "免運"}</td></tr>
      <tr><td><b>應付金額</b></td><td><b style="color:var(--red);font-size:18px">${money(o.total)}</b></td></tr></table>
    ${shipBlock(o)}
    ${has("ship") ? logiBlock(o) : ""}
    <button class="btn ghost" data-print style="width:100%;margin-top:8px">列印出貨單（撿貨用）</button>
    ${has("ship") ? `<div class="statusbar">${STATUSES.map(s => `<button data-s="${s}" aria-pressed="${o.status === s}">${s}</button>`).join("")}</div>` : ""}
    <div class="btns">${has("orderDel") ? '<button class="btn danger" data-odel style="flex:none">刪除</button>' : ""}${has("pay") ? `<button class="btn ${o.payStatus === "paid" ? "ghost" : "ink"}" data-pay>${o.payStatus === "paid" ? "改為未付款" : "標記已付款"}</button>` : ""}</div>`;
  openModal();
  $("mPanel").onclick = e => {
    if (e.target.closest("[data-x]")) return closeModal();
    if (e.target.closest("[data-print]")) return printSlip(o);
    const lc = e.target.closest("[data-logi]");
    if (lc && lc.dataset.logi === "again" && lc.dataset.c !== "1") { lc.dataset.c = "1"; lc.textContent = "確認重新建單"; return; }
    if (lc) return busy(lc, async () => { const r = await admin("admin_logiCreate", {orderNo: o.orderNo, again: lc.dataset.logi === "again"}); o.shipments = r.shipments; toast("已建立寄件單"); openOrder(no); }).catch(err => toast(err.message));
    const lp = e.target.closest("[data-lprint]");
    if (lp) { // 綠界列印頁要整頁開（不能用 iframe）：先開空白分頁，拿到簽章後送表單過去，避免被擋彈出視窗
      const nm = "lp" + Date.now(), w = window.open("", nm);
      return busy(lp, async () => {
        const r = await admin("admin_logiPrint", {orderNo: o.orderNo});
        const f = document.createElement("form"); f.method = "POST"; f.action = r.url; f.target = w ? nm : "_blank";
        for (const [k, v] of Object.entries(r.fields)) { const i = document.createElement("input"); i.type = "hidden"; i.name = k; i.value = v; f.appendChild(i); }
        document.body.appendChild(f); f.submit(); f.remove();
      }).catch(err => { if (w) w.close(); toast(err.message); });
    }
    const cp = e.target.closest("[data-cp]");
    if (cp) { copyText(cp.dataset.cp).then(() => { cp.classList.add("done"); cp.querySelector("i").textContent = "已複製"; }); return; }
    if (e.target.closest("[data-cpall]")) { copyText(shipFields(o).filter(([, v]) => v).map(([k, v]) => `${k}：${v}`).join("\n")).then(() => toast("已複製寄件資料")); return; }
    const s = e.target.closest("[data-s]");
    if (s && s.dataset.s !== o.status) busy(s, async () => {
      await admin("admin_orderStatus", {orderNos: [o.orderNo], value: s.dataset.s}, {tries: 2});
      o.status = s.dataset.s; toast("已更新為「" + o.status + "」"); openOrder(no); drawOrders();
    }).catch(err => toast(err.message));
    const od = e.target.closest("[data-odel]");
    if (od) { if (od.dataset.confirm !== "1") { od.dataset.confirm = "1"; od.textContent = "確認刪除"; return; }
      busy(od, async () => { await admin("admin_deleteOrder", {orderNo: o.orderNo}); orders = orders.filter(x => x !== o); closeModal(); drawOrders(); toast("已刪除訂單"); }).catch(err => toast(err.message)); return; }
    const p = e.target.closest("[data-pay]");
    if (p) busy(p, async () => {
      const v = o.payStatus === "paid" ? "unpaid" : "paid";
      await admin("admin_orderStatus", {orderNos: [o.orderNo], field: "payStatus", value: v}, {tries: 2});
      o.payStatus = v; toast(v === "paid" ? "已標記付款" : "已改為未付款"); openOrder(no);
    }).catch(err => toast(err.message));
  };
}

// 裝箱計算：跟後端 packCaps_ 同一算法（7-11 交貨便以 45×30×30、10 公斤計；黑貓用設定的紙箱、每箱 20 公斤）
const homeBox = () => { const b = String(data.settings.homeBox || "40,30,20").split(/[,x×*\s]+/).map(Number).filter(n => n > 0); return b.length === 3 ? b : [40, 30, 20]; };
function packCaps(d, kg) {
  d = d.map(n => n + 1); // 每邊留 1 公分包材（同後端 PACK_PAD）
  const fit = box => Math.max(...[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]].map(p => Math.floor(box[0] / d[p[0]]) * Math.floor(box[1] / d[p[1]]) * Math.floor(box[2] / d[p[2]])));
  const byKg = lim => kg > 0 ? Math.floor(lim / kg) : Infinity;
  return {cvs: Math.min(fit([45, 30, 30]), byKg(10)), home: Math.max(1, Math.min(fit(homeBox()), byKg(20)))};
}

      <div class="f"><label>多件優惠</label><div id="tiers">${p.tiers.map((t, i) => `<div class="tierrow">

          <input type="number" inputmode="numeric" data-tp="${i}" value="${t.price}" placeholder="每件價格" aria-label="每件價格">

        <button class="btn ghost" data-tadd style="align-self:flex-start">＋ 新增級距</button><span class="note">例：2 件以上每件 $900、3 件以上每件 $850</span></div>

      <div class="f2"><div class="f"><label for="pco">每件成本</label><input id="pco" type="number" inputmode="decimal" min="0" value="${p.cost || ""}" placeholder="未填＝0"></div>
        <div class="f"><label for="psu">貨主（代售商品）</label><input id="psu" list="supList" value="${esc(p.supplier || "")}" placeholder="空白＝自有商品">

          <button type="button" data-sm="profit" aria-pressed="${p.splitMode !== "commission"}">淨利分成<small>扣成本與支出後依成數拆</small></button>

        <div class="f2"><div class="f"><label for="pcm" id="pcmL">${p.splitMode === "commission" ? "我方抽成 %" : "我方成數 %"}</label><input id="pcm" type="number" inputmode="decimal" min="0" max="100" step="0.5" value="${p.supplier ? p.commission : ""}" placeholder="${p.splitMode === "commission" ? "例：5" : "例：50"}"></div>
          <div class="f" id="pcbF" ${p.splitMode === "commission" ? "hidden" : ""}><label for="pcb">成本出資</label><select id="pcb"><option value="us" ${p.costBy !== "owner" ? "selected" : ""}>我方出資</option><option value="owner" ${p.costBy === "owner" ? "selected" : ""}>貨主出資</option></select></div></div>
        <div class="splitprev" id="splitPrev"></div></div>
      <label class="check"><input type="checkbox" id="pa" ${p.active ? "checked" : ""}>上架</label>

        <div class="f"><label for="pdw">寬 cm</label><input id="pdw" type="number" inputmode="decimal" step="0.1" value="${pd[1] || ""}"></div>

        <div class="f"><label for="pwt">重量 kg</label><input id="pwt" type="number" inputmode="decimal" step="0.01" value="${p.weight || ""}"></div></div>
      <span class="note" style="display:block;margin:-4px 0 8px">填包裝後（含盒）的尺寸，系統自動判斷可否走 7-11 及每件可裝數量（每邊已預留 1 公分包材）</span>
      <div class="packres" id="packRes"></div>
      <div id="packManual">
      <label class="check"><input type="checkbox" id="pv" ${p.cvsOk ? "checked" : ""}>可 7-11 店到店（小件）</label>
      <div class="f2"><div class="f"><label for="pcv">一個交貨便可裝幾件</label><input id="pcv" type="number" inputmode="numeric" min="0" value="${p.cvsPer || ""}" placeholder="不限"></div>
        <div class="f"><label for="phm">一箱宅急便可裝幾件</label><input id="phm" type="number" inputmode="numeric" min="0" value="${p.homePer || ""}" placeholder="不限"></div></div></div>
      <div class="err" id="perr"></div>
      <div class="btns">${id ? '<button class="btn danger" data-del style="flex:none">刪除</button>' : ""}<button class="btn" data-save>儲存</button></div>`;
  };
  const read = () => {
    p.name = $("pn").value.trim(); p.category = $("pc").value; p.price = Number($("pp").value) || 0; p.listPrice = Number($("pl").value) || 0;
    p.stock = $("ps").value === "" ? -1 : Number($("ps").value); p.desc = $("pd").value; p.active = $("pa").checked; p.hot = $("ph").checked; p.cvsOk = $("pv").checked; p.cvsPer = Number($("pcv").value) || 0; p.homePer = Number($("phm").value) || 0; p.brand = $("pb").value.trim(); p.supplier = $("psu").value.trim(); p.commission = p.supplier ? Number($("pcm").value) || 0 : 0; p.preorder = $("ppo").checked;
    p.cost = Number($("pco").value) || 0; p.splitMode = ($("psm").querySelector('[aria-pressed="true"]') || {dataset: {sm: "profit"}}).dataset.sm; p.costBy = $("pcb").value;
    const dm = ["pdl", "pdw", "pdh"].map(k => Number($(k).value) || 0); p.dims = dm.every(n => n > 0) ? dm.join(",") : ""; p.weight = Number($("pwt").value) || 0;
    p.tiers = [...document.querySelectorAll("[data-tq]")].map((el, i) => ({qty: Number(el.value) || 0, price: Number(document.querySelector(`[data-tp="${i}"]`).value) || 0}));
  };
  draw(); openModal();
  // 裝箱結果即時顯示（算法同後端 packCaps_）；有尺寸就隱藏手動欄位
  const packShow = () => {
    const d = ["pdl", "pdw", "pdh"].map(k => Number($(k).value) || 0), kg = Number($("pwt").value) || 0, c = d.every(n => n > 0) ? packCaps(d, kg) : null;
    $("packManual").hidden = !!c;
    $("packRes").innerHTML = c ? `<div class="${c.cvs ? "ok" : "no"}"><b>7-11 交貨便</b><span>${c.cvs ? `每件可裝 ${c.cvs} 個` : "超過尺寸或重量，僅限黑貓"}</span></div>
      <div class="ok"><b>黑貓宅急便</b><span>每箱可裝 ${c.home} 個（${homeBox().join("×")} 紙箱）</span></div>` : "";
  };
  setTimeout(packShow);
  // 拆帳試算：以售價、每件成本、預估金流 2.75%＋物流（交貨便每件 / 可裝數）算一件的我方與貨主各得多少
  const splitShow = () => {
    const sup = $("psu").value.trim(); $("splitBox").hidden = !sup; if (!sup) return;
    const mode = ($("psm").querySelector('[aria-pressed="true"]') || {dataset: {sm: "profit"}}).dataset.sm;
    $("pcmL").textContent = mode === "commission" ? "我方抽成 %" : "我方成數 %"; $("pcbF").hidden = mode === "commission";
    const price = Number($("pp").value) || 0, cost = Number($("pco").value) || 0, rate = Number($("pcm").value) || 0;
    const fee = Math.round((Math.max(price * 0.0275, 5) * 1.05) + 1), logi = Math.round(68 / Math.max(1, Number($("pcv").value) || p.cvsPer || 1));
    let us, owner, note;
    if (mode === "commission") { us = Math.round(price * rate / 100); owner = price - us - fee - logi; note = `售價 ${money(price)} × ${rate}%`; }
    else { const profit = price - cost - fee - logi; us = Math.round(profit * rate / 100); owner = profit - us + ($("pcb").value === "owner" ? cost : 0); note = `淨利 ${money(profit)}（售價 − 成本 ${money(cost)} − 金流約 ${money(fee)} − 物流約 ${money(logi)}）× ${rate}%`; }
    $("splitPrev").innerHTML = price ? `<div><span>每賣一件・我方</span><b>${money(us)}</b></div><div><span>應付貨主</span><b>${money(owner)}</b></div><small>${note}${mode === "profit" && $("pcb").value === "us" && cost ? "；成本由我方出資，已從淨利扣除" : ""}</small>` : "";
  };
  setTimeout(splitShow);
  $("mPanel").addEventListener("input", e => { if (e.target.matches("#pp,#pco,#psu,#pcm,#pcv")) splitShow(); });
  $("mPanel").addEventListener("change", e => { if (e.target.matches("#pcb")) splitShow(); });
  $("mPanel").addEventListener("click", e => { const b = e.target.closest("[data-sm]"); if (!b) return; $("psm").querySelectorAll("[data-sm]").forEach(x => x.setAttribute("aria-pressed", x === b)); splitShow(); });
  $("mPanel").addEventListener("input", e => { if (e.target.matches("#pdl,#pdw,#pdh,#pwt")) packShow(); });
  $("mPanel").oninput = e => { if (e.target.matches("[data-tp],[data-tq],#pp")) { read(); [...document.querySelectorAll(".tierrow span")].forEach((s, i) => s.textContent = zhe(p.tiers[i].price, p.price)); } };
  $("mPanel").onclick = async e => {
    if (e.target.closest("[data-x]")) return closeModal();
    if (e.target.closest("[data-tadd]")) { read(); const last = p.tiers.slice(-1)[0]; p.tiers.push({qty: last ? last.qty + 1 : 2, price: ""}); draw(); return; }
    const trm = e.target.closest("[data-trm]"); if (trm) { read(); p.tiers.splice(Number(trm.dataset.trm), 1); draw(); return; }
    const rm = e.target.closest("[data-rm]"); if (rm) { read(); p.images.splice(Number(rm.dataset.rm), 1); draw(); return; }
    const sf = e.target.closest("[data-first]"); if (sf) { read(); p.images.unshift(p.images.splice(Number(sf.dataset.first), 1)[0]); draw(); return; }
    const add = e.target.closest("[data-addimg]");
    if (add) { read(); const files = await pickFiles("image/*", true); if (!files.length) return;
      await busy(add, async () => { for (const f of files) { add.textContent = "上傳中"; p.images.push(await uploadImage(f)); } }).catch(err => toast(err.message)); draw(); return; }
    const save = e.target.closest("[data-save]");
    if (save) { read();
      if (!p.name) return $("perr").textContent = "請填寫商品名稱";
      if (!(p.price > 0)) return $("perr").textContent = "請填寫售價";
      if (p.supplier && !(p.commission > 0 && p.commission < 100)) return $("perr").textContent = "有貨主的商品請填寫我方分潤 %（1–99）";
      const bad = p.tiers.find(t => !(t.qty >= 2) || !(t.price > 0) || t.price >= p.price);
      if (bad) return $("perr").textContent = "多件優惠：件數需 2 以上，每件價格需低於售價";
      busy(save, async () => { await admin("admin_saveProduct", {product: {...p, id}}); await loadAll(); closeModal(); drawProducts(); toast("已儲存"); })
        .catch(err => $("perr").textContent = err.message); }
    const del = e.target.closest("[data-del]");
    if (del) { if (del.dataset.confirm !== "1") { del.dataset.confirm = "1"; del.textContent = "確認刪除"; return; }
      busy(del, async () => { await admin("admin_deleteProduct", {id}); await loadAll(); closeModal(); drawProducts(); toast("已刪除"); }).catch(err => toast(err.message)); }
  };
}

  const cs = data.codes, today = new Date().toLocaleDateString("sv-SE", {timeZone: "Asia/Taipei"});

// 初始資金與回本：以「全部期間」已付款訂單的我方分潤累計，扣掉我方出資的成本與支出前已在淨利內處理
function capitalCard() {

  const keep = rpt.range, f = rpt.from, t = rpt.to; rpt.range = "custom"; rpt.from = "2000-01-01"; rpt.to = "2100-12-31";
  const all = rptCompute(); rpt.range = keep; rpt.from = f; rpt.to = t;

      <div class="tierbar"><i style="width:${pct}%"></i></div><div class="note">回本進度 ${pct}%（累計分潤＋已售出商品回收的成本 ÷ 初始資金，全部期間）</div>` : '<div class="note">尚未設定初始資金</div>'}</div>`;

function rptCompute() {
  const [from, to] = rptRange();

  const unpaid = orders.filter(o => inRange(o) && o.payStatus !== "paid");
  const lines = [];
  for (const o of os) {
    const base = o.items.reduce((a, i) => a + i.total, 0) || 1;
    for (const i of o.items) {
      const sh = i.total / base;
      const disc = Math.round((o.codeDiscount + (o.pointsUsed || 0)) * sh), net = i.total - disc;
      const ship = Math.round((o.shipping || 0) * sh), pf = Math.round((o.payFee || 0) * sh), logi = Math.round((o.logiCost || 0) * sh);
      lines.push({date: o.createdAt.slice(0, 10), orderNo: o.orderNo, status: o.status, paid: o.payStatus === "paid", name: i.name, qty: i.qty, unit: i.unit,
        gross: i.total, disc, net, ship, sale: net + ship, pf, logi, other: 0, supplier: i.supplier || "", rate: i.supplier ? Number(i.commission) || 0 : 100,
        cogs: Math.round((Number(i.cost) || 0) * i.qty), mode: i.splitMode === "commission" ? "commission" : "profit", costBy: i.costBy === "owner" ? "owner" : "us"});
    }
  }
  const exp = (expenses || []).filter(x => x.date >= from && x.date <= to);
  for (const x of exp) {
    const pool = lines.filter(l => x.scope === "all" || l.supplier === x.scope), tot = pool.reduce((a, l) => a + l.sale, 0);
    if (!tot) continue;
    let left = x.amount; pool.forEach((l, k) => { const v = k === pool.length - 1 ? left : Math.round(x.amount * l.sale / tot); l.other += v; left -= v; });
  }
  // 兩種拆帳（商品頁設定，下單時快照進訂單）：
  //   淨利分成：淨利＝成交 − 成本 − 金流 − 物流 − 其他支出；我方＝淨利 × 成數；貨主＝淨利 − 我方（成本由貨主出資時再加回成本）
  //   銷售抽成：我方＝商品淨額 × 抽成 %（淨賺）；金流、物流、其他支出都由貨主那份負擔
  for (const l of lines) {
    l.cost = l.pf + l.logi + l.other;
    if (l.mode === "commission" && l.supplier) {
      l.fee = Math.round(l.net * l.rate / 100); l.profit = l.sale - l.cogs - l.cost; l.payable = l.sale - l.cost - l.fee;
    } else {

  for (const l of lines.filter(l => l.supplier)) {
    const g = sup[l.supplier] = sup[l.supplier] || {name: l.supplier, lines: [], prods: {}};
    g.lines.push(l);

    ["qty", "sale", "cogs", "cost", "profit", "fee", "payable"].forEach(k => pp[k] += l[k]);

}

    const sk = o.shipMethod.startsWith("7-11") ? "7-11 交貨便" : "黑貓宅急便", y = ship[sk] = ship[sk] || {n: 0, pk: 0, income: 0, cost: 0};

    <div class="note" style="margin-bottom:8px">${r.from} ～ ${r.to}・${rpt.withUnpaid ? "含未付款訂單（僅供參考，未收款不出貨）" : "只算已付款"}・排除已取消</div>

async function drawAudit(reload) {
  const box = $("auditBox"); if (!box) return;

      <input id="afQ" type="search" placeholder="搜尋訂單編號、商品…" value="${esc(auditF.q)}"><button class="btn ghost" id="afR" style="flex:none;height:40px">重新整理</button></div>
    ${list.length ? Object.keys(days).map(d => `<h3 class="adh">${d === today ? "今天" : d}</h3><div class="card alist">${days[d].map(l => `<div class="ar ${cls(l)}">

  $("afU").onchange = e => { auditF.user = e.target.value; drawAudit(); };

  box.innerHTML = r.users.map(u => `<details class="card ucard" data-u="${esc(u.name)}">

      <div class="f"><label for="lgAddr">寄件地址（黑貓到府收件）</label><input id="lgAddr" value="${esc(s.senderAddr || "")}" placeholder="縣市區＋路名門牌"></div>
      <span class="note">與金流同一組綠界特店。交貨便到任一 7-11 寄件；黑貓需另外預約收件或自行送至營業所。</span>
      <div class="err" id="lgErr"></div><div class="btns"><button class="btn ink" id="lgSave">儲存物流設定</button></div></div>
    </section><section data-sec="line" ${st === "line" ? "" : "hidden"}>
    <h2>LINE 下單通知</h2><div class="card" id="lineBox"><div class="note">讀取中…</div></div>
    </section><section data-sec="audit" ${st === "audit" ? "" : "hidden"}><h2>操作紀錄</h2><div id="auditBox"><div class="card note">載入中…</div></div>
    </section><section data-sec="acct" ${st === "acct" ? "" : "hidden"}>
    ${accountCard(isDefault)}
    ${role() === "owner" ? '<h2>帳號與權限</h2><div id="usersBox"><div class="card note">載入中…</div></div>' : ""}</section>`;
  const nc = $("main").querySelector("[data-newcode]");
  if (nc) nc.onclick = () => { tab = "codes"; sessionStorage.setItem("cp-tab", tab); drawApp(); editCode(null); };
  $("main").querySelector(".subtabs").onclick = e => { const b = e.target.closest("[data-st]"); if (b) { setTab = b.dataset.st; sessionStorage.setItem("cp-settab", setTab); drawSettings(); } };
  bindAccount(); if (role() === "owner" && st === "acct") drawUsers(); if (st === "line") drawLine(); if (st === "audit" && role() === "owner") drawAudit();
  if (st === "logi") admin("admin_logiStatus", {}, {tries: 2}).then(r => {
    const l = r.logi, ok = l.enabled && l.senderOk && l.keySet;
    $("lgStatus").innerHTML = `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><div><b style="font-size:17px">${!l.enabled ? "未啟用" : !l.senderOk ? "寄件人資料不完整" : l.stage ? "已啟用（測試模式）" : "已連接（正式）"}</b>
      <span class="note" style="display:block">${l.auto ? "付款成功自動建單" : "手動建單"}・7-11 交貨便＋黑貓宅急便</span></div><span class="pill ${ok && !l.stage ? "on" : l.enabled ? "warn" : "off"}">${ok && !l.stage ? "運作中" : l.enabled ? "測試" : "關閉"}</span></div>`;
  }).catch(e => $("lgStatus").innerHTML = `<div class="note">${esc(e.message)}</div>`);
  if ($("lgSave")) $("lgSave").onclick = e => busy(e.target, async () => {
    $("lgErr").textContent = "";
    const ph = $("lgPhone").value.replace(/\D/g, "");
    if ($("lgOn").checked && !/^09\d{8}$/.test(ph)) throw new Error("寄件人手機為 09 開頭 10 碼");
    await admin("admin_saveSettings", {settings: {logiOn: $("lgOn").checked ? "TRUE" : "FALSE", logiAuto: $("lgAuto").checked ? "TRUE" : "FALSE", logiStage: $("lgStage").checked ? "TRUE" : "FALSE",
      senderName: $("lgName").value.normalize("NFKC").trim(), senderPhone: ph, senderZip: $("lgZip").value.trim(), senderAddr: $("lgAddr").value.normalize("NFKC").trim(), homeBox: $("lgBox").value.replace(/[^\d.,]/g, "") || "40,30,20",
      logiFeeCvs: String(Number($("lgFc").value) || 65), logiFeeHome: $("lgFh").value.replace(/[^\d,]/g, "") || "130,170,210,250"}});
    await loadAll(); toast("已儲存"); drawSettings();
  }).catch(err => $("lgErr").textContent = err.message);
  $("sSave").onclick = e => busy(e.target, async () => {
    await admin("admin_saveSettings", {settings: {shipBarOn: $("sbOn").checked ? "TRUE" : "FALSE", shipBar: $("sb").value.trim(), ordersOpen: $("sopen").checked ? "TRUE" : "FALSE", shipFee: Number($("sf").value) || 0, shipFeeCvs: Number($("sc").value) || 0, freeShipOver: Number($("so").value) || 0, lineUrl: $("sl").value.trim(), notice: $("sn").value.trim(), welcomeCode: $("swc").value, welcomeDays: String(Math.max(1, Number($("swd").value) || 30)), welcomeRemind: String(Math.max(1, Number($("swr").value) || 3)), hotWords: $("shw").value.trim(), pointsOn: $("spOn").checked ? "TRUE" : "FALSE", pointRate: Number($("spR").value) || 100, pointMaxPct: Number($("spM").value) || 50}});
    await loadAll(); toast("已儲存");
  }).catch(err => $("serr").textContent = err.message);
  if (has("integrations") && st === "pay") admin("admin_ecpayStatus", {}, {tries: 2}).then(r => {
    const e = r.ecpay, live = e.enabled && !e.stage && e.keySet && e.ivSet;
    $("ecStatus").innerHTML = `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
      <div><b style="font-size:17px">${!e.enabled ? "未啟用" : live ? "已連接（正式）" : e.stage ? "已啟用（測試模式）" : "缺少金鑰"}</b>
        <span class="note" style="display:block">${e.mid ? "商店代號 " + esc(e.mid.slice(0, 3)) + "•••" + esc(e.mid.slice(-2)) : "尚未設定商店代號"}・信用卡＋ATM 虛擬帳號</span></div>
      <span class="pill ${live ? "on" : e.enabled ? "warn" : "off"}">${live ? "收款中" : e.enabled ? "測試" : "關閉"}</span></div>
      <button class="btn ghost" id="ecEdit" style="margin-top:12px;width:100%">重新設定金鑰</button>`;
    $("ecEdit").onclick = ev => { const b = ev.target; if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "確認要修改金流設定？再按一次"; return; } $("ecCard").hidden = false; b.hidden = true; };
    $("ecOn").checked = e.enabled; $("ecStage").checked = e.stage; $("ecMid").value = e.mid;
    $("ecKey").placeholder = e.keySet ? "已設定（留空不變更）" : "未設定"; $("ecIv").placeholder = e.ivSet ? "已設定（留空不變更）" : "未設定";
  }).catch(() => {});
  $("ecSave").onclick = e => busy(e.target, async () => {
    $("ecErr").textContent = "";
    if ($("ecOn").checked && !$("ecStage").checked && !$("ecMid").value.trim()) throw new Error("正式模式需填商店代號與金鑰");
    const r = await admin("admin_saveEcpay", {ecpay: {enabled: $("ecOn").checked, stage: $("ecStage").checked, mid: $("ecMid").value.trim(), key: $("ecKey").value.trim(), iv: $("ecIv").value.trim()}});
    if ($("ecOn").checked && !$("ecStage").checked && !(r.ecpay.keySet && r.ecpay.ivSet)) throw new Error("正式模式缺少 HashKey 或 HashIV");
    $("ecKey").value = $("ecIv").value = ""; toast("已儲存金流設定"); drawSettings();
  }).catch(err => $("ecErr").textContent = err.message);
  // 防誤觸（使用者 2026-11-07）：預設鎖住，按「修改」才能改；儲存要再按一次確認
  const feeIds = ["fcp", "fcm", "fco", "fap", "fam", "fsp"];
  const lockFee = on => { feeIds.forEach(id => $(id).disabled = on); $("fBtns").hidden = on; $("fUnlock").hidden = !on; };
  lockFee(true);
  $("fUnlock").onclick = () => lockFee(false);
  $("fReset").onclick = () => { [["fcp", "2.75"], ["fcm", "5"], ["fco", "1"], ["fap", "1"], ["fam", "15"], ["fsp", "ratio"]].forEach(([id, v]) => $(id).value = v); toast("已填入綠界預設，按儲存才會生效"); };
  $("fSave").onclick = e => {
    const b = e.target;
    if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "確認儲存（會影響報表拆帳）"; setTimeout(() => { b.dataset.confirm = ""; b.textContent = "儲存手續費設定"; }, 4000); return; }
    return saveFee(e);
  };
  const saveFee = e => busy(e.target, async () => {
    await admin("admin_saveSettings", {settings: {feeCardPct: $("fcp").value, feeCardMin: $("fcm").value, feeCardOrder: $("fco").value, feeAtmPct: $("fap").value, feeAtmMin: $("fam").value, feeSplit: $("fsp").value}});
    await loadAll(); toast("已儲存"); drawSettings();
  }).catch(err => $("ferr").textContent = err.message);

}

/* ── 上傳 ── */
function pickFiles(accept, multiple) {
  return new Promise(res => { const inp = $("fileIn"); inp.value = ""; inp.accept = accept; inp.multiple = !!multiple;
    inp.onchange = () => res([...inp.files]); inp.click(); });
}
const toB64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(blob); });
async function uploadFile(file) {
  const r = await admin("admin_upload", {name: file.name, mime: file.type, data: await toB64(file)}, {timeout: 300000});
  return r.src || "drive:" + r.fileId; // 影片回 media/…（存在網站上），圖片回 drive:<id>
}
// 圖片先在瀏覽器縮到最長邊 1600、轉 JPEG，上傳快、賣場載入也快
async function uploadImage(file) {
  const img = await createImageBitmap(file);
  const k = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", .86));
  return uploadFile(new File([blob], file.name.replace(/\.\w+$/, "") + ".jpg", {type: "image/jpeg"}));
}

function openModal() { $("modal").classList.add("open"); document.body.style.overflow = "hidden"; $("mPanel").scrollTop = 0; }
function closeModal() { $("modal").classList.remove("open"); document.body.style.overflow = ""; $("mPanel").onclick = $("mPanel").oninput = null; }
$("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });

// 送簽好章的表單到綠界列印頁；target 省略＝本分頁（LINE 通知點進來不必再按一次，也不會被擋彈出視窗）
function postForm(f, target) {
  const el = document.createElement("form"); el.method = "POST"; el.action = f.url; if (target) el.target = target;
  for (const [k, v] of Object.entries(f.fields)) { const i = document.createElement("input"); i.type = "hidden"; i.name = k; i.value = v; el.appendChild(i); }
  document.body.appendChild(el); el.submit(); el.remove();
}
async function openFromHash() {
  const pm = location.hash.match(/^#print=(\w+)/);
  if (pm) { history.replaceState(null, "", location.pathname); // LINE 通知「列印託運單」：登入後直接開綠界列印頁
    $("app").innerHTML = '<div class="empty">開啟託運單中…</div>';
    try { postForm(await admin("admin_logiPrint", {orderNo: pm[1]}, {tries: 2})); return; } catch (e) { toast(e.message); drawApp(); }
  }
  const m = location.hash.match(/^#order=(\w+)/); if (!m) return;
  history.replaceState(null, "", location.pathname);
  tab = "orders"; drawApp(); if (!orders) await loadOrders();
  if (orders.some(o => o.orderNo === m[1])) openOrder(m[1]);
  else toast("訂單 " + m[1] + " 不存在或已刪除"); // 通知裡的測試單刪除後點進來，不要只停在訂單列表
}
/* ── 後台 LINE 登入／綁定（2026-11-09）──
   LINE Login 的 Callback 只登記賣場網址，state 用 a_ 開頭，賣場頁會把 ?code&state 轉回這裡；state 自己比對防偽造。 */
function adminLineGo(invite) {
  const rnd = () => [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, "0")).join("");
  const st = "a_" + rnd(), nonce = rnd();
  try { sessionStorage.setItem("cp-alstate", JSON.stringify({st, nonce, invite})); } catch (e) {}
  location.href = "https://access.line.me/oauth2/v2.1/authorize?response_type=code&client_id=2012457738&redirect_uri=" + encodeURIComponent("https://linpoyes.github.io/lipo-guide/shop.html")
    + "&state=" + st + "&scope=openid%20profile&nonce=" + nonce;
}
async function adminLineBack() {
  const q = new URLSearchParams(location.search); if (!/^a_/.test(q.get("state") || "")) return false;
  history.replaceState(null, "", location.pathname);
  let saved = {}; try { saved = JSON.parse(sessionStorage.getItem("cp-alstate") || "{}"); sessionStorage.removeItem("cp-alstate"); } catch (e) {}
  if (!q.get("code") || saved.st !== q.get("state")) { drawLogin(); $("lerr").textContent = "LINE 登入未完成，請再試一次"; return true; }
  $("app").innerHTML = '<div class="empty">LINE 驗證中…</div>';
  try {
    const r = await api({action: "adminLine", code: q.get("code"), state: q.get("state"), nonce: saved.nonce, invite: saved.invite || ""});
    token = r.token; lsSet("cp-admin", token); lsSet("cp-default-pw", "");
    await loadAll(); drawApp(); if (saved.invite) toast("已完成 LINE 綁定，之後可直接用 LINE 登入");
  } catch (e) { drawLogin(); $("lerr").textContent = e.message; }
  return true;
}
// 邀請連結 admin.html#inv=…：顯示綁定頁
function inviteFromHash() {
  const m = location.hash.match(/^#inv=([0-9a-f]{40,})/); if (!m) return false;
  history.replaceState(null, "", location.pathname);
  $("app").innerHTML = `<div class="wrap login"><img src="badge.png?v=1" alt=""><h1>後台授權</h1><div style="color:var(--dim);font-weight:700">赤貧軍團</div>
    <div class="card" style="text-align:center"><p style="margin:0 0 14px;font-weight:700">您已獲邀使用赤貧軍團管理後台，請以 LINE 完成綁定。綁定後即可用 LINE 直接登入。</p>
    <button type="button" class="btn lineb" id="invGo" style="width:100%"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3C6.5 3 2 6.6 2 11c0 3.9 3.5 7.2 8.3 7.9.3.1.8.2.9.5.1.3.1.7 0 1l-.1.9c0 .3-.2 1 .9.5s5.9-3.5 8.1-6C21.4 14.2 22 12.7 22 11c0-4.4-4.5-8-10-8z"/></svg>以 LINE 綁定並登入</button></div></div>`;
  $("invGo").onclick = () => adminLineGo(m[1]);
  return true;
}
/* ── 啟動 ── */
// 只有後端明確回「auth」（過期／失效）才登出；連線失敗不登出，避免 GAS 冷啟動就被踢掉
(async () => {
  if (await adminLineBack()) return;
  if (inviteFromHash()) return;
  if (token) { $("app").innerHTML = '<div class="empty">載入中…</div>';
    loadAll().then(async () => { drawApp(); await openFromHash(); }).catch(e => { if (!token) return; $("app").innerHTML = `<div class="empty">${esc(e.message)}<br><br><button class="btn" data-reload>重新整理</button></div>`; }); }
  else drawLogin();
})();
document.addEventListener("click", e => { if (e.target.closest("[data-reload]")) location.reload(); });
</script>
