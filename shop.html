<title>赤貧軍團｜RC 玩車商城</title>

<meta property="og:type" content="website">
<meta property="og:site_name" content="赤貧軍團">
<meta property="og:image" content="https://linpoyes.github.io/lipo-guide/shop-hero.jpg?v=1">

<style>
/* 視覺沿用 index.html（浮世繪：和紙米色／北齋藍／朱紅／墨黑）；版型依使用者給的「RC 玩車商城首頁」 */
:root{
  color-scheme:light dark;
  /* 2026-11-07 護眼調整：底色更淡、卡片接近白、字改深灰（不用純黑），朱紅只留給價格／加入購物車／熱銷 */
  --bg:#F5F1EA; --card:#FFFDF9; --line:#E6DED1; --text:#2A2F3A; --dim:#575D69; --faint:#7A7F89;
  --accent:#1C3F7C; --red:#C9362C; --ink:#2B2F38; --ok:#2C7A52; --bad:#B3261E; --chip:#3A3F4A;
  --sel:rgba(28,63,124,.10); --wash:rgba(26,33,48,.055); --gold:#94701F; --gray:#5F6472;
}
@media (prefers-color-scheme: dark){
  :root{
    /* 深色改成低飽和的墨灰（原本深藍色偏亮、看久刺眼），文字不用純白 */
    --bg:#15181E; --card:#1D2129; --line:#2C313B; --text:#E6E1D8; --dim:#B4AFA6; --faint:#8C8880;
    --accent:#8FB0E6; --red:#E2584D; --ink:#22262E; --ok:#66C495; --bad:#F08078; --chip:#E6E1D8;
    --sel:rgba(127,168,236,.17); --wash:rgba(243,236,223,.06); --gold:#DDBB72; --gray:#A9A79F;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-feature-settings:"tnum"}
button{font:inherit;cursor:pointer}
button:disabled{filter:grayscale(.6) opacity(.6);cursor:default}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── 頁首 ── */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-top:8px;padding-bottom:8px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;flex:none}
.brand img{width:40px;height:40px;border-radius:10px}
.brand b{display:block;font-size:20px;font-weight:900;color:var(--red);letter-spacing:.04em;line-height:1.1}
.brand small{display:block;font-size:11px;color:var(--dim);font-weight:700;letter-spacing:.02em}
.search{flex:1;min-width:0;display:flex;background:var(--card);border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font:inherit;padding:8px 10px}
.search input:focus{outline:none}
/* 熱門搜尋：頁首下方一排關鍵字，點了直接搜尋（後台可自訂，空白＝依品牌與分類自動產生） */
.hotq{display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none;margin:10px -14px 0;padding:0 14px;white-space:nowrap}
.hotq::-webkit-scrollbar{display:none}
.hotq span{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--dim);letter-spacing:.08em}
.hotq span svg{width:14px;height:14px;color:var(--red)}
.hotq button{flex:none;border:0;background:transparent;color:var(--dim);border-radius:6px;padding:4px 8px;font-size:13px;font-weight:700}
.hotq button::before{content:"#";color:var(--faint);margin-right:2px}
.hotq button:hover{color:var(--text);background:var(--wash)}
.hotq button[aria-pressed=true]{background:var(--chip);border-color:var(--chip);color:var(--bg)}
.search button{flex:none;width:44px;border:0;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center}
.cartbtn{position:relative;flex:none;margin-left:auto;width:44px;height:44px;border:0;background:var(--ink);color:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center}
.cartbtn i{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;font-weight:800;font-style:normal;line-height:20px;text-align:center;border:2px solid var(--bg)}
.cartbtn i:empty{display:none}
.hacts{display:flex;gap:8px;margin-left:auto;flex:none}
/* 會員鈕：未登入＝人像圖示；登入＝圓形大頭貼＋右下綠點（已加好友）；電腦版加上名稱與等級 */
.membtn{padding:0;gap:8px}
.membtn .av{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none}
.membtn .on{position:absolute;left:34px;bottom:7px;width:10px;height:10px;border-radius:50%;background:#06C755;border:2px solid var(--ink)}
.membtn .nm{display:none;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:800;text-align:left;line-height:1.2}
.membtn .nm small{display:block;font-size:11px;font-weight:700;color:#C9CBD2}

.npanel .mem{margin:14px 0 0}
/* 會員中心 */
.ptrow{display:flex;align-items:flex-start;gap:10px}.ptrow .ptitle{flex:1}
.favbtn{flex:none;margin-top:10px;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--dim);display:flex;align-items:center;justify-content:center}
.favbtn svg path{fill:none}.favbtn[aria-pressed=true]{color:var(--red);border-color:var(--red)}.favbtn[aria-pressed=true] svg path{fill:currentColor}
.mchead{display:flex;align-items:center;gap:12px;margin:8px 0 12px}.mchead img{width:52px;height:52px;border-radius:50%;flex:none}
.mchead div{flex:1;min-width:0}.mchead b{display:block;font-size:18px}
.tier{display:inline-block;margin-top:3px;font-size:12px;font-weight:900;letter-spacing:.06em;border-radius:999px;padding:2px 10px;color:#fff;background:#6E7383}
.tier.t1{background:linear-gradient(135deg,#A9B4C2,#6F7C8E)}.tier.t2{background:linear-gradient(135deg,#E8C25A,#B8862B)}.tier.t3{background:linear-gradient(135deg,#3A3D46,#0E0F13);box-shadow:inset 0 0 0 1px #E8C25A;color:#E8C25A}
.mcstat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mcstat div{background:var(--ink);color:#fff;border-radius:12px;padding:10px 12px;position:relative}
.mcstat small{display:block;color:#C9CBD2;font-size:12px;font-weight:700}.mcstat b{font-size:22px;font-weight:900}
.mcstat i{display:block;font-style:normal;font-size:11px;color:#FFB650;font-weight:700}
.tierbar{height:8px;border-radius:4px;background:var(--line);margin:12px 0 4px;overflow:hidden}.tierbar i{display:block;height:100%;background:linear-gradient(90deg,#D7261E,#FF8A3D);border-radius:4px}
.tiernote{font-size:12px;color:var(--dim);font-weight:700}
.mctabs{display:flex;gap:6px;margin:14px 0 10px;position:sticky;top:-16px;background:var(--bg);padding:8px 0;z-index:2}
.mctabs button{flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:7px 0;font-weight:800;font-size:14px}
.mctabs button[aria-pressed=true]{background:var(--chip);border-color:var(--chip);color:var(--bg)}
.mco{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.mco summary{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;list-style:none}.mco summary::-webkit-details-marker{display:none}
.mco summary>div:first-child{flex:1;min-width:0}.mco summary b{display:block;font-size:15px}.mco summary small{color:var(--dim);font-size:12px}
.mco .r{text-align:right}.st{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:1px 8px;margin-top:2px}
.st.ok{color:#1F7A4A;background:rgba(31,122,74,.12)}.st.wait{color:#A85A00;background:rgba(168,90,0,.12)}.st.off{color:var(--dim);background:var(--wash)}
.mcod{padding:0 12px 12px;border-top:1px dashed var(--line)}.mcod p{display:flex;justify-content:space-between;gap:10px;margin:8px 0 0;font-size:14px}
.mcod p.m span:last-child{color:var(--red)}.mcod .note{display:block;color:var(--dim);font-size:12px}.mcod .va{display:block;background:var(--wash);border-radius:8px;padding:8px 10px;font-weight:700}
.mcod .btn{width:100%;margin-top:10px;height:42px}
.gift.used{opacity:.55;border-color:var(--line)}
.gift .soon,.gift small.soon{color:var(--red);font-weight:800}.gift small+small{margin-top:0}
.ptsbig{background:var(--ink);color:#fff;border-radius:14px;padding:16px;text-align:center}.ptsbig small{color:#C9CBD2;font-weight:700}.ptsbig b{display:block;font-size:40px;font-weight:900;line-height:1.2}.ptsbig span{font-size:13px;color:#C9CBD2}
.rules{margin:10px 0;font-size:13px;color:var(--dim)}.rules p{margin:4px 0;padding-left:14px;position:relative}.rules p::before{content:"";position:absolute;left:2px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--red)}
.plog{display:flex;justify-content:space-between;font-size:14px;border-bottom:1px solid var(--line);padding:8px 0;margin:0}.plog b{margin-left:10px}.plog .up{color:#1F7A4A}.plog .down{color:var(--red)}
.mch{margin:14px 0 8px;font-size:15px}
.mcgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mcgrid button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 0 8px;overflow:hidden;text-align:left;color:var(--text)}
.mcgrid img,.mcgrid i{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:var(--wash)}
.mcgrid span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;font-weight:700;margin:6px 8px 2px;line-height:1.35}.mcgrid b{font-size:13px;color:var(--red);margin:0 8px}
.perks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:4px 0 6px}
.perks div:last-child:nth-child(odd){grid-column:1/-1}
.perks div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.perks b{display:block;font-size:14px}.perks span{font-size:12px;color:var(--dim)}
.ptsrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
.ptsrow input{width:20px;height:20px;accent-color:var(--red)}.ptsrow b{display:block;font-size:15px}.ptsrow small{color:var(--dim);font-size:12px}
svg{width:22px;height:22px}
@media (max-width:520px){.brand small{display:none}.brand b{font-size:17px}.top .wrap{flex-wrap:wrap}.search{order:3;flex-basis:100%}}

/* ── 主視覺 ── */
.hero{display:block;width:100%;height:auto;aspect-ratio:1619/370;object-fit:cover;border-radius:16px;border:3px solid var(--ink);margin-top:12px;background:#E9DFC9}
/* 手機：窗口取「貧」徽章到「玩車不貧」那一段 */
@media (max-width:640px){.hero{aspect-ratio:2.4/1;object-position:88% 50%}}
.notice{margin-top:10px;background:var(--ink);color:#fff;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700;box-shadow:inset 3px 0 0 var(--red)}
.notice:empty{display:none}

/* ── 分類列 ── */
.frow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.flabel{flex:none;width:34px;font-size:13px;font-weight:800;color:var(--dim)}
.frow .cats{flex:1;min-width:0;margin:0 -14px 0 0;padding:2px 14px 2px 0}
.cats button.zero{opacity:.5}
.promos button[aria-pressed=true]{border-color:var(--red);box-shadow:0 0 0 2px var(--red)}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px 10px;padding:2px 14px}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;display:flex;align-items:center;gap:5px;height:36px;padding:0 13px;border:1.5px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;font-size:14px;font-weight:800;white-space:nowrap}
.cats button[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
.cats button small{font-size:12px;opacity:.7;font-weight:700}
.cats svg{width:17px;height:17px}

/* ── 段落標題（同 index.html 的墨色筆刷條） ── */
h2{display:flex;align-items:center;gap:10px;width:fit-content;max-width:100%;font-size:18px;line-height:1.3;margin:22px 0 10px;
  background:var(--ink);color:#fff;padding:6px 22px 6px 10px;border-radius:10px 4px 4px 10px;clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%)}
h2::before{content:"";flex:none;width:14px;height:14px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px #fff}
@media (prefers-color-scheme: dark){h2{background:#262A35}.cartbtn{background:#262A35}.btn.ink{background:#262A35}}
.h2row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sortsel{margin-top:12px;font:inherit;font-size:14px;font-weight:800;color:var(--text);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:5px 8px}
.h2row a{font-size:14px;font-weight:700;color:var(--dim);text-decoration:none;margin-top:12px}

/* ── 短影音 ── */
.reels{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px 4px;scroll-snap-type:x mandatory}
.reels::-webkit-scrollbar{display:none}
.reel{position:relative;flex:none;width:150px;aspect-ratio:9/16;border-radius:14px;overflow:hidden;border:2px solid var(--ink);background:#000;scroll-snap-align:start;padding:0;color:#fff}
.reel img,.reel video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.reel::after{display:none}
.reel .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:rgba(215,38,30,.92);display:flex;align-items:center;justify-content:center;z-index:1}
.reel.live .play{display:none}
.reel .snd{position:absolute;top:8px;right:8px;z-index:1;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center}
.reel.live .snd{display:flex}
.reel .snd svg{width:14px;height:14px}
.vplayer{object-fit:contain}
.vwrap{position:relative}
.vwrap .mute{position:absolute;top:10px;left:10px;z-index:2;width:44px;height:44px;border:2px solid rgba(255,255,255,.85);border-radius:50%;background:rgba(0,0,0,.72);box-shadow:0 2px 8px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:0}
.vwrap .mute svg{width:22px;height:22px}
.reel .play svg{width:22px;height:22px;margin-left:3px}
.reel.skel{border-color:transparent;background:linear-gradient(90deg,var(--wash),var(--line),var(--wash));background-size:200% 100%;animation:sk 1.2s infinite}
.reel.skel::after{display:none}
/* 廣告牆（2026-11-08）：影片直式大格（跨兩列）＋商品方格拼成一面牆；手機 3 欄、電腦 5 欄 */
.reels.wall{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-flow:row dense;gap:8px;overflow:visible;margin:0;padding:0}
.wall .reel{width:auto;grid-row:span 2;aspect-ratio:auto;min-height:100%}
.wtile{position:relative;aspect-ratio:1;padding:0;border:0;border-radius:12px;overflow:hidden;background:#17181D;color:#fff;text-align:left}
.wtile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .35s}
.wtile:hover img{transform:scale(1.05)}
.wtile::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.82))}
.wtile span{position:absolute;left:8px;right:8px;bottom:7px;z-index:1;font-size:12px;font-weight:800;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wtile em{position:absolute;top:7px;left:7px;z-index:1;font-style:normal;font-size:11px;font-weight:900;background:var(--red);color:#fff;border-radius:6px;padding:2px 7px}
.wtile.m2{display:none}
@media (min-width:760px){.reels.wall{grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.wtile.m2{display:block}.wtile.m3{display:none}.wtile span{font-size:14px;left:10px;right:10px;bottom:9px}}
.reel b{position:absolute;left:8px;right:8px;bottom:8px;z-index:1;font-size:13px;line-height:1.35;text-align:left;font-weight:800}

/* ── 專區橫幅 ── */
.promos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.promos button{position:relative;display:block;height:104px;padding:0;border:2px solid var(--ink);border-radius:14px;overflow:hidden;background:#17181D;text-align:left;color:#fff}
.promos img{position:absolute;right:0;top:0;width:62%;height:100%;object-fit:cover;-webkit-mask-image:linear-gradient(90deg,transparent,#000 35%);mask-image:linear-gradient(90deg,transparent,#000 35%)}
.promos span{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center;height:100%;padding:0 14px;gap:4px;max-width:66%}
.promos b{font-size:20px;font-weight:900;letter-spacing:.06em;line-height:1.15;text-shadow:0 2px 6px rgba(0,0,0,.8)}
.promos small{font-size:12px;font-weight:700;color:#D6D8DE;text-shadow:0 1px 4px rgba(0,0,0,.9)}

/* 角標（2026-11-08 使用者：商品要凸顯 HOT、要會動）：HOT 會輕跳＋光澤掃過，NEW 只有光澤；系統設定「減少動態」時全部靜止 */
.rib{position:absolute;top:10px;left:10px;z-index:2;overflow:hidden;font:900 12px/1 system-ui,sans-serif;letter-spacing:.12em;color:#fff;padding:6px 10px 5px;border-radius:7px;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.rib.hot{background:linear-gradient(135deg,#FF5A1F,#D7261E);animation:ribHop 2.6s ease-in-out infinite}
.rib.new{background:linear-gradient(135deg,#2F6BFF,#1F4FD1)}
.rib::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);animation:ribShine 3.2s ease-in-out infinite}
.rib.new::after{animation-delay:1.2s}
@keyframes ribHop{0%,62%,100%{transform:translateY(0) scale(1)}70%{transform:translateY(-4px) scale(1.08)}78%{transform:translateY(0) scale(1)}84%{transform:translateY(-2px) scale(1.04)}90%{transform:translateY(0)}}
@keyframes ribShine{0%,55%{left:-60%}85%,100%{left:130%}}
/* HOT 卡片：火焰流動外框＋閃爍火光（使用者 2026-11-08：框框有火焰更凸顯） */
@property --fa{syntax:"<angle>";inherits:false;initial-value:0deg}
.pcard.ishot{border:2px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,conic-gradient(from var(--fa),#FF3D00,#FFB300,#FF6A00,#D7261E,#FFD54A,#FF3D00) border-box;animation:flameSpin 3s linear infinite,flameGlow 1.6s ease-in-out infinite alternate}
@keyframes flameSpin{to{--fa:360deg}}
@keyframes flameGlow{0%{box-shadow:0 0 10px rgba(255,90,20,.35),0 6px 18px rgba(215,38,30,.18)}50%{box-shadow:0 0 18px rgba(255,140,0,.5),0 8px 24px rgba(215,38,30,.25)}100%{box-shadow:0 0 12px rgba(255,61,0,.42),0 4px 16px rgba(215,38,30,.2)}}
.rib.hot{display:inline-flex;align-items:center;gap:3px;padding-left:7px}
.rib .fl{width:13px;height:13px;transform-origin:50% 90%;animation:flick .5s ease-in-out infinite alternate}
@keyframes flick{0%{transform:scale(1,1) rotate(-3deg)}100%{transform:scale(.9,1.12) rotate(3deg)}}
@media (prefers-reduced-motion:reduce){.pcard.ishot,.rib .fl{animation:none}}
@media (prefers-reduced-motion:reduce){.rib,.rib::after{animation:none}}

const $ = id => document.getElementById(id);
const ICON = {
  all: '<path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/>',
  battery: '<rect x="6" y="4" width="12" height="17" rx="2.5"/><path d="M10 2.5h4M13 8l-3 5h3l-1 4 3-5h-3z"/>',
  car: '<path d="M3 15l2-5h11l3 4h2v3H3z"/><circle cx="7.5" cy="17.5" r="2"/><circle cx="16.5" cy="17.5" r="2"/>',
  parts: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',
  wheel: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v6M12 15v6M3 12h6M15 12h6"/>',
  motor: '<rect x="4" y="7" width="12" height="10" rx="2"/><path d="M16 10h3v4h-3M8 4v3M12 4v3"/>',
  radio: '<rect x="3" y="9" width="18" height="10" rx="3"/><path d="M8 9V4M7 14h2M8 13v2M15 14h.01M17 13h.01"/>',
  tool: '<path d="M14.5 6.5a4 4 0 0 0 5 5L12 19a2.1 2.1 0 0 1-3-3l7.5-7.5zM5 5l4 4"/>',

};
const svg = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>`;

// 型錄快取：只用 10 分鐘內的，避免開頁先閃出舊商品（2026-11-08 使用者看到已刪除的示範商品閃一下）
// 換 key（v2）讓舊版快取全部作廢
try { ["cp-catalog", "cp-catalog2", "cp-catalog3"].forEach(k => localStorage.removeItem(k)); } catch (e) {}
// 先用上次存的型錄立刻畫出商品（7 天內都用，背景再抓最新的蓋過去）——不必等後端（2026-11-09 使用者：從 LINE 點進來要等）
let catalog = (c => c && c.at > Date.now() - 7 * 86400000 ? c.d : null)(lsGet("cp-catalog4", null));
let cart = lsGet("cp-cart", []);          // [{id, qty}]
let code = lsGet("cp-code", "");
let filter = {cat: "all", brand: "", q: "", sort: lsGet("cp-sort", "rec")};

// 分類只顯示「有上架商品」的那幾類（手機版面小，空分類只會佔位置）；項目旁顯示件數
const inBrand = p => !filter.brand || p.brand === filter.brand;
const inCat = p => filter.cat === "all" || p.category === filter.cat;
function renderCats() {

// 左右滑（IG 嵌入框內的手勢由 IG 接走，所以在框外或一般影片上滑；框內用兩側箭頭）
let vTouch = null;
$("vPanel").addEventListener("touchstart", e => { const t = e.touches[0]; vTouch = {x: t.clientX, y: t.clientY}; }, {passive: true});
$("vPanel").addEventListener("touchend", e => { if (!vTouch) return; const t = e.changedTouches[0], dx = t.clientX - vTouch.x, dy = t.clientY - vTouch.y; vTouch = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) stepVideo(dx < 0 ? 1 : -1); }, {passive: true});
addEventListener("keydown", e => { if (!$("vSheet").classList.contains("open")) return; if (e.key === "ArrowRight") stepVideo(1); if (e.key === "ArrowLeft") stepVideo(-1); });
function syncMute() {
  const v = $("vPanel").querySelector("video"), b = $("vPanel").querySelector("[data-mute]"); if (!v || !b) return;
  b.innerHTML = v.muted ? SND_OFF : SND_ON; b.setAttribute("aria-label", v.muted ? "開啟音效" : "關閉音效");
}
$("vPanel").addEventListener("click", e => {
  const m = e.target.closest("[data-mute]");
  if (m) { const v = $("vPanel").querySelector("video"); v.muted = !v.muted; if (!v.muted) v.play().catch(() => {}); syncMute(); return; }
  if (e.target.matches(".vwrap video")) { const v = e.target; v.paused ? v.play() : v.pause(); return; }
});
$("vPanel").addEventListener("click", e => { const b = e.target.closest("[data-open]"); if (b) { close("vSheet"); openProduct(b.dataset.open); } });

/* ── 浮層開關 ── */
// 彈出視窗時鎖住背景（2026-11-09 使用者：看影片滑動時後面版面一直動）：iPhone 的 overflow:hidden 擋不住觸控捲動，
// 所以把 body 固定在目前位置，關閉時再捲回原處
let lockY = 0;
function lockBody(on) {
  const b = document.body;
  if (on && !b.classList.contains("locked")) { lockY = scrollY; b.style.top = -lockY + "px"; b.classList.add("locked"); }
  if (!on && b.classList.contains("locked")) { b.classList.remove("locked"); b.style.top = ""; scrollTo(0, lockY); }
}
// 不可命名為 open：會蓋掉 window.open（2026-11-10 選 7-11 門市因此打不開）
function openSheet(id) { $(id).classList.add("open"); lockBody(true); }
function close(id) {
  $(id).classList.remove("open");
  if (id === "vSheet") $("vPanel").innerHTML = ""; // 停止播放
  if (!document.querySelector(".sheet.open")) lockBody(false);
}
document.querySelectorAll(".sheet").forEach(s => s.addEventListener("click", e => {
  if (e.target === s || e.target.closest("[data-close]")) close(s.id);
}));
addEventListener("keydown", e => { if (e.key === "Escape") document.querySelectorAll(".sheet.open").forEach(s => close(s.id)); });

/* ── 商品詳情 ── */
let pQty = 1;
function openProduct(id) {
  const p = catalog.products.find(x => x.id === id); if (!p) return;
  cpTrack("product", {pid: id});
  lsSet("cp-recent", [id, ...lsGet("cp-recent", []).filter(x => x !== id)].slice(0, 12));
  pQty = 1;
  let gi = 0;   // 目前第幾張；改數量會重畫整塊，要記住位置，不然會跳回第一張
  const nImg = p.images.length;
  const imgs = p.images.length ? p.images.map(s => `<img src="${esc(imgUrl(s, BIG_W))}" alt="">`).join("") : `<div class="noimg">${svg(p.category || "all")}</div>`;
  const draw = () => {
    const u = unitPrice(p, pQty), out = p.stock === 0;
    $("pPanel").innerHTML = `<button class="close" data-close aria-label="關閉">×</button>
      <div class="gwrap"><div class="gallery">${imgs}</div>${nImg > 1 ? `<button class="gnav prev" data-g="-1" aria-label="上一張">‹</button><button class="gnav next" data-g="1" aria-label="下一張">›</button>` : ""}</div>
      ${nImg > 1 ? `<div class="gdots">${p.images.map((_, i) => `<button data-gi="${i}" aria-label="第 ${i + 1} 張"></button>`).join("")}</div>` : ""}
      ${p.brand ? `<div class="bname" style="margin-top:12px">${esc(p.brand)}</div>` : ""}<div class="ptrow"><div class="ptitle" ${p.brand ? 'style="margin-top:2px"' : ""}>${esc(p.name)}</div><button type="button" class="favbtn" data-fav aria-pressed="${isFav(p.id)}" aria-label="收藏">${HEART}</button></div>
      <div class="price"><b>${money(p.price)}</b>${p.listPrice > p.price ? `<s>${money(p.listPrice)}</s>` : ""}<span class="hint">${esc(catName(p.category))}${p.stock > 0 ? `・庫存 ${p.stock}` : ""}</span></div>
      ${p.tiers.length ? `<table class="tiers"><tr><th>多件優惠</th><th>每件</th></tr>
        <tr class="${u === p.price ? "on" : ""}"><td>1 件</td><td>${money(p.price)}</td></tr>
        ${p.tiers.map(t => `<tr class="${u === t.price && pQty >= t.qty ? "on" : ""}"><td>${t.qty} 件以上</td><td>${money(t.price)}　<span class="tierhint">${zhe(t.price, p.price)}</span></td></tr>`).join("")}</table>` : ""}
      ${(pv => pv.length ? `<div class="pvids">${pv.map(v => `<button type="button" class="pvid" data-pvid="${esc(v.id)}"><img src="${esc(v.poster ? imgUrl(v.poster, 300) : videoInfo(v.src).thumb || "")}" alt=""><span>▶</span></button>`).join("")}</div>` : "")((catalog.videos || []).filter(v => v.kind === "product" && v.productId === p.id))}
      ${p.desc ? `<div class="desc">${esc(p.desc)}</div>` : ""}
      <div class="buyrow">
        <div class="stepper"><button data-q="-1" aria-label="減少">−</button><span>${pQty}</span><button data-q="1" aria-label="增加">＋</button></div>
        <button class="btn" data-add ${out || !canBuy(p) ? "disabled" : ""}>${out ? "已售完" : !canBuy(p) ? "即將開賣，敬請期待" : `加入購物車　${money(u * pQty)}`}</button>
      </div>`;
    const g = $("pPanel").querySelector(".gallery");
    g.scrollLeft = gi * gStep(g);
    g.onscroll = () => { const i = Math.round(g.scrollLeft / gStep(g)); if (i !== gi) { gi = i; mark(); } };
    mark();
  };
  // 每張圖剛好一個 gallery 寬（無間距、無內距），切換才會對齊不露出隔壁張
  const gStep = g => Math.max(1, g.clientWidth);
  // 箭頭與圓點：電腦上沒辦法用手指滑，必須有按鈕才能切換
  const mark = () => {
    const pn = $("pPanel");
    pn.querySelectorAll(".gdots button").forEach((b, i) => b.classList.toggle("on", i === gi));
    const pv = pn.querySelector(".gnav.prev"), nx = pn.querySelector(".gnav.next");
    if (pv) { pv.disabled = gi <= 0; nx.disabled = gi >= nImg - 1; }
  };
  const goImg = i => { gi = Math.max(0, Math.min(nImg - 1, i)); const g = $("pPanel").querySelector(".gallery"); g.scrollTo({left: gi * gStep(g), behavior: "smooth"}); mark(); };
  draw();
  $("pPanel").onclick = e => {
    const gb = e.target.closest("[data-g]"); if (gb) return goImg(gi + Number(gb.dataset.g));
    const gd = e.target.closest("[data-gi]"); if (gd) return goImg(Number(gd.dataset.gi));
    const q = e.target.closest("[data-q]");
    if (q) { const max = p.stock > 0 ? p.stock : 99; pQty = Math.min(max, Math.max(1, pQty + Number(q.dataset.q))); draw(); }
    if (e.target.closest("[data-add]")) { addToCart(p.id, pQty); close("pSheet"); openCart(); }
    const pvb = e.target.closest("[data-pvid]"); if (pvb) { playVideo(pvb.dataset.pvid, "product"); return; }
    const fv = e.target.closest("[data-fav]"); if (fv) { toggleFav(p.id); fv.setAttribute("aria-pressed", isFav(p.id)); toast(isFav(p.id) ? "已加入收藏" : "已取消收藏"); }
  };
  openSheet("pSheet");
}

/* ── 購物車 ── */
function saveCart() { lsSet("cp-cart", cart); $("cartCount").textContent = $("cartCount2").textContent = cart.reduce((s, l) => s + l.qty, 0) || ""; }
function addToCart(id, qty) {
  cpTrack("cart", {pid: id, n: qty});
  const l = cart.find(x => x.id === id);
  if (l) l.qty += qty; else cart.push({id, qty});
  saveCart();
}
// 前台預覽計價（不含折扣碼；折扣碼要問後端才知道有效與否）
function localQuote() {
  let subtotal = 0, tierSaving = 0;
  const lines = cart.map(l => {
    const p = catalog && catalog.products.find(x => x.id === l.id);
    if (!p) return null;
    const u = unitPrice(p, l.qty);
    subtotal += u * l.qty; tierSaving += (p.price - u) * l.qty;
    return {p, qty: l.qty, unit: u};
  }).filter(Boolean);
  return {lines, subtotal, tierSaving};
}
// 寄送：黑貓宅配（大件）／7-11 店到店（全部商品都勾「可超商寄送」才能選）
const SHIP_HOME = "黑貓宅配", SHIP_CVS = "7-11 店到店";
let serverQuote = null, step = "cart", ship = lsGet("cp-ship", SHIP_HOME), store = lsGet("cp-store", null);
const cvsAllowed = () => cart.length > 0 && cart.every(l => { const p = catalog && catalog.products.find(x => x.id === l.id); return p && p.cvsOk; });
const shipNow = () => ship === SHIP_CVS && cvsAllowed() ? SHIP_CVS : SHIP_HOME;
// 7-11 交貨便電子地圖：選完門市 POST 回 Apps Script（?cb=711），再帶 #store=… 回到本頁
// 選門市：地圖開在新分頁；選完 Apps Script 把門市存進快取（以 sk 為鍵）並自己關掉那一頁，
// 這邊輪詢拿回門市直接填上——不需要使用者再按「回到賣場」。新分頁被擋時退回同頁跳轉（#store=… 帶回）。
const storeMapUrl = sk => "https://emap.presco.com.tw/c2cemap.ashx?eshopid=870&servicetype=1&url=" + encodeURIComponent(API + "?cb=711" + (sk ? "&sk=" + sk : ""));
let storePoll = null;
function pickStore() {
  saveDraft();
  const sk = crypto.getRandomValues(new Uint32Array(4)).join("");
  const win = window.open(storeMapUrl(sk), "_blank");
  if (!win) { location.href = storeMapUrl(""); return; }
  clearInterval(storePoll);
  const started = Date.now();
  const check = async () => {
    if (Date.now() - started > 15 * 60000) return clearInterval(storePoll);
    try {
      const r = await (await fetch(API + "?action=store&sk=" + sk + "&_=" + Date.now())).json();
      if (r.store && r.store.id) {
        clearInterval(storePoll); document.removeEventListener("visibilitychange", onVis);
        try { win.close(); } catch (e) {}
        store = r.store; lsSet("cp-store", store); ship = SHIP_CVS; lsSet("cp-ship", ship);
        drawCart(); refreshQuote();
      }
    } catch (e) {}
  };
  const onVis = () => { if (!document.hidden) check(); };
  document.addEventListener("visibilitychange", onVis);
  storePoll = setInterval(check, 2500);
}

async function refreshQuote() {
  if (!cart.length) { serverQuote = null; drawCart(); return; }
  const key = JSON.stringify([cart, code, shipNow(), usePts]);
  try {
    const r = await api({action: "quote", items: cart, code, shipMethod: shipNow(), memberToken: memTok, usePoints: usePts}, {tries: 3});
    if (key === JSON.stringify([cart, code, shipNow(), usePts])) { serverQuote = r.quote; drawCart(); }
  } catch (e) { /* 連不上時維持前台預覽 */ }
}

function totals() {
  const lq = localQuote();
  const s = (catalog && catalog.settings) || {shipFee: 0, freeShipOver: 0};
  const sq = serverQuote;
  const codeDiscount = sq && sq.code ? sq.codeDiscount : 0;
  const after = lq.subtotal - codeDiscount;
  // 包裹數與後端 quote_ 同一算法：每項依「每個包裹可裝幾件」換算占比、加總後無條件進位
  const cvs = shipNow() === SHIP_CVS; let share = 0;
  lq.lines.forEach(({p, qty}) => { const per = cvs ? p.cvsPer : p.homePer; if (per > 0) share += qty / per; });
  const packages = lq.lines.length ? Math.max(1, Math.ceil(share - 1e-9)) : 0;
  const shipping = !lq.lines.length || (s.freeShipOver > 0 && after >= s.freeShipOver) ? 0 : (cvs ? s.shipFeeCvs : s.shipFee) * packages;
  const pointsDiscount = sq && usePts ? sq.pointsDiscount || 0 : 0;
  return {...lq, codeDiscount, shipping, packages, pointsDiscount, total: after + shipping - pointsDiscount, freeShipOver: s.freeShipOver};
}

      ${codeMsg}${ptsRow()}${summary}
      <div class="buyrow"><button class="btn" data-step="form" ${catalog.settings.ordersOpen ? "" : "disabled"}>${catalog.settings.ordersOpen ? "前往結帳" : "尚未開放下單"}</button></div>`;
  } else {
    $("cPanel").innerHTML = `<button class="close" data-close aria-label="關閉">×</button><div class="ptitle">填寫訂購資料</div>
      ${memberBox(true)}

$("cPanel").addEventListener("click", e => {
  const cq = e.target.closest("[data-cq]");
  if (cq) {
    const l = cart.find(x => x.id === cq.dataset.id), p = catalog.products.find(x => x.id === cq.dataset.id);
    l.qty += Number(cq.dataset.cq);
    if (p && p.stock > 0) l.qty = Math.min(l.qty, p.stock);
    if (l.qty <= 0) cart = cart.filter(x => x !== l);
    saveCart(); serverQuote = null; drawCart(); refreshQuote();
  }
  const st = e.target.closest("[data-step]");
  if (st) { step = st.dataset.step; if (step === "form") cpTrack("checkout"); drawCart(); $("cPanel").scrollTop = 0; }
  const lg = e.target.closest("[data-login]"); if (lg) { lineLogin(lg); return; }
  if (e.target.closest("[data-logout]")) { memTok = ""; member = null; lsSet("cp-mem", ""); drawCart(); drawMemBtn(); return; }
  if (e.target.closest("[data-usegift]")) { useGift(); return; }
  const rc = e.target.closest("[data-recheck]"); if (rc) { busy(rc, async () => { await loadMember(); drawCart(); if (!(member && member.friend)) toast("尚未偵測到加入好友，請稍候再試"); }); return; }
  const pb = e.target.closest("[data-pay]");
  if (pb) { payM = pb.dataset.pay; lsSet("cp-pay", payM); for (const b of $("pays").children) b.setAttribute("aria-pressed", b === pb); }
  const sb = e.target.closest("[data-ship]");
  if (sb && !sb.disabled) { saveDraft(); ship = sb.dataset.ship; lsSet("cp-ship", ship); serverQuote = null; drawCart(); refreshQuote(); }
  if (e.target.closest("[data-pickstore]")) pickStore();
});
$("cPanel").addEventListener("submit", e => {

        ${!paid && va ? `<div class="va"><div><small>銀行代碼</small><b>${esc(r.vaBank)}</b></div><div><small>轉帳帳號</small><b>${esc(r.vaAccount)}</b></div><div><small>繳費期限</small><b>${esc(r.vaExpire)}</b></div></div>
          <p class="hint">此帳號僅顯示一次，請截圖保存；轉帳完成後會自動確認</p>` : ""}
        ${paid ? '<p class="hint">我們將盡快安排出貨</p>' : !va ? '<p class="hint">若已付款請稍候再查看，或與我們聯絡</p>' : ""}</div>`;
      return;
    } catch (e) { await new Promise(res => setTimeout(res, 2500)); }
  }
}
// 去選門市前先把填到一半的資料存起來，回來時還原
function saveDraft() {
  if (!$("oName")) return;
  lsSet("cp-draft", {name: $("oName").value, phone: $("oPhone").value, line: $("oLine").value,
    county: $("oCounty").value, dist: $("oDist").value, street: $("oAddr").value, note: $("oNote").value});
}
// 縣市 → 區域下拉，並顯示 3 碼郵遞區號
function fillDist(sel) {
  const list = TW_ZIP[$("oCounty").value] || [];
  $("oDist").innerHTML = '<option value="">鄉鎮市區</option>' + list.map(([d]) => `<option ${d === sel ? "selected" : ""}>${d}</option>`).join("");
  showZip();
}
function showZip() {
  const z = (TW_ZIP[$("oCounty").value] || []).find(([d]) => d === $("oDist").value);
  $("oZip").textContent = z ? "郵遞區號 " + z[1] : "";
  return z ? z[1] : "";
}
// 姓名離開欄位就檢查，錯誤直接顯示在欄位下方（紅字），不用等送出
$("cPanel").addEventListener("focusout", e => {
  if (e.target.id !== "oName" || !e.target.value.trim()) return;
  const m = checkName(e.target.value.normalize("NFKC").replace(/\s+/g, " ").trim()), h = $("nameHint");
  h.innerHTML = m ? `<b>${esc(m)}</b>請填寫身分證上的真實姓名：中文 2–5 字或英文 4–10 字母，不可有數字與符號。`
    : "<b>請填寫身分證上的真實姓名</b>包裹已付款（取貨 0 元），門市與物流人員會核對身分證件，姓名不符將無法領取。請勿填寫暱稱或 LINE 名稱。";
});
$("cPanel").addEventListener("change", e => { if (e.target.id === "oCounty") fillDist(""); if (e.target.id === "oDist") showZip();
  if (e.target.matches("[data-usepts]")) { usePts = e.target.checked; lsSet("cp-usepts", usePts); serverQuote = null; drawCart(); refreshQuote(); } });
// 地址固定成「郵遞區號＋縣市＋區＋路名」，後台複製後可直接貼進黑貓寄件
function homeAddress() {
  const zip = showZip(), street = $("oAddr").value.trim().normalize("NFKC");
  return zip && street ? `${zip}${$("oCounty").value}${$("oDist").value}${street}` : "";
}
function lineNudge() {
  const g = giftInfo(), d = document.createElement("div"); d.className = "npop jpop"; d.id = "nudgePop";
  d.innerHTML = `<div class="npanel jpanel" role="dialog" aria-modal="true"><img class="jbadge" src="badge.png?v=1" alt="">
    <b>${member ? "加入官方帳號好友" : "還不是 LINE 會員"}</b>
    <p class="jsub">${member ? "加入好友才收得到出貨與到店通知" : g ? `加入即折 <em>${esc(g.label)}</em>，出貨進度 LINE 即時通知` : "加入後出貨進度 LINE 即時通知"}</p>
    ${member ? `<a class="linebtn jbtn" href="https://line.me/R/ti/p/@552xxfur" target="_blank" rel="noopener">加入官方帳號好友</a>` : `<button type="button" class="linebtn jbtn" data-nlogin>LINE 一鍵加入會員</button>`}
    <button type="button" class="jlater" data-nskip>直接下單</button></div>`;
  $("cSheet").appendChild(d);
  d.onclick = e => {
    if (e.target.closest("[data-nskip]")) { d.remove(); submitOrder(); return; }
    const lg = e.target.closest("[data-nlogin]"); if (lg) { saveDraft(); lineLogin(lg); }
    if (e.target === d) d.remove();
  };
}
async function submitOrder() {
  const sm = shipNow();
  const c = {name: $("oName").value.trim(), phone: $("oPhone").value.trim(), line: $("oLine").value.trim(), shipMethod: sm,
             address: sm === SHIP_CVS ? (store ? `7-11 ${store.name}門市（店號 ${store.id}）${store.addr}` : "") : homeAddress(),
             note: $("oNote").value.trim()};
  const err = $("orderErr");
  c.name = c.name.normalize("NFKC").replace(/\s+/g, " ").trim();
  const nameErr = checkName(c.name);
  if (nameErr) { err.textContent = nameErr; $("oName").focus(); return; }
  if (!$("idOk").checked) { err.textContent = "請確認收件人姓名與身分證件相同"; $("idOk").focus(); return; }
  if (!c.phone) { err.textContent = "請填寫手機"; return; }
  if (!/^09\d{8}$/.test(c.phone.replace(/[-\s]/g, ""))) { err.textContent = "手機格式為 09 開頭 10 碼"; return; }
  if (!c.address) { err.textContent = sm === SHIP_CVS ? "請選擇 7-11 門市" : !$("oCounty").value || !$("oDist").value ? "請選擇縣市與區域" : "請填寫路名門牌"; return; }
  c.phone = c.phone.replace(/[-\s]/g, "");
  // 不是 LINE 會員：送出前提醒一次（2026-11-09 使用者：提醒，不加入也能下單）
  if (!(member && member.friend) && !submitOrder.asked) { submitOrder.asked = true; return lineNudge(); }
  const prev = lsGet("cp-customer", {});
  lsSet("cp-customer", {name: c.name, phone: c.phone, line: c.line, ...(sm === SHIP_HOME ? {county: $("oCounty").value, dist: $("oDist").value, street: $("oAddr").value.trim()} : {county: prev.county, dist: prev.dist, street: prev.street})});
  // clientId 讓重送不會重複下單（後端依它去重），所以這個動作可以安全重試
  const clientId = lsGet("cp-pending", null) || (Date.now().toString(36) + Math.random().toString(36).slice(2, 8));
  lsSet("cp-pending", clientId);
  await busy($("submitBtn"), async () => {
    err.textContent = "";
    try {
      const r = await api({action: "order", clientId, customer: c, items: cart, code: serverQuote && serverQuote.code ? code : "", memberToken: memTok, usePoints: usePts, payMethod: catalog.settings.payReady ? payM : ""}, {tries: 3});
      lsSet("cp-last", {no: r.orderNo, cid: clientId});
      cpTrack("order", {pid: r.orderNo, n: r.total});
      if (r.pay) { cart = []; saveCart(); lsSet("cp-code", ""); lsSet("cp-pending", null); lsSet("cp-draft", null); goPay(r.pay); return; }
      cart = []; code = ""; saveCart(); lsSet("cp-code", ""); lsSet("cp-pending", null); lsSet("cp-draft", null); serverQuote = null;
      step = "done";
      const lineUrl = catalog.settings.lineUrl;
      $("cPanel").innerHTML = `<button class="close" data-close aria-label="關閉">×</button>
        <div class="done"><div class="ptitle">訂單已送出</div><div class="no">${esc(r.orderNo)}</div>
        <div>應付金額 <b style="color:var(--red);font-size:20px">${money(r.total)}</b></div>
        <p class="hint">專人將以電話或 LINE 與您確認付款與出貨</p>
        ${lineUrl ? `<div class="buyrow" style="position:static;border:0"><a class="btn ink" href="${esc(lineUrl)}" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:center;text-decoration:none">LINE 聯絡</a></div>` : ""}</div>`;
    } catch (e) { err.textContent = e.message; }
  });
}

/* ── 隱藏的後台入口：頁尾徽章 3 秒內連點 5 下（使用者 2026-10-31：後台入口不要顯示） ── */
{ let n = 0, t = 0;
  $("footBadge").addEventListener("click", () => {
    const now = Date.now(); n = now - t < 3000 ? n + 1 : 1; t = now;
    if (n >= 5) location.href = "admin.html";
  }); }

/* ── 載入 ── */
function renderAll() {
  const st = catalog && catalog.settings;
  // 免運公告：後台可關閉或自訂文字；空白時依免運門檻自動產生
  $("shipbar").textContent = st && st.shipBarOn !== false ? (st.shipBar || (st.freeShipOver > 0 ? `全站滿 ${money(st.freeShipOver)} 免運` : "")) : "";
  showNotice(st && st.notice);
  renderHot(); renderReels(); refilter(); saveCart();
}
// LINE 登入網址直接在前端產生（不必先問後端，少一次 Apps Script 往返）；state 回來時比對防 CSRF，nonce 交後端給 LINE 驗 id_token
function lineAuthUrl() {
  const rnd = () => [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, "0")).join("");
  const st = rnd(), nonce = rnd();
  try { sessionStorage.setItem("cp-lstate", st + "|" + nonce); } catch (e) {}
  return "https://access.line.me/oauth2/v2.1/authorize?response_type=code&client_id=2012457738&redirect_uri=" + encodeURIComponent("https://linpoyes.github.io/lipo-guide/shop.html") /* 必須與 LINE 後台登記的 Callback 完全一致 */
    + "&state=" + st + "&scope=openid%20profile&nonce=" + nonce + "&bot_prompt=aggressive";
}
// LINE 登入回來：網址帶 ?code&state（LINE 直接導回賣場），先把網址清乾淨，背景換會員權杖
const lineBack = (() => {
  const u = new URLSearchParams(location.search);
  if (!u.get("state") || !(u.get("code") || u.get("error")) || u.get("liffClientId")) return null; // LIFF 自己的登入回呼交給 LIFF SDK
  let back = location.hash; try { back = sessionStorage.getItem("cp-after-hash") || back; sessionStorage.removeItem("cp-after-hash"); } catch (e) {}
  history.replaceState(null, "", location.pathname + back); // 自動登入前要去的 #member／#orders 等，登入回來接著開
  if (!u.get("code")) return Promise.resolve(false);
  let ls = ""; try { ls = sessionStorage.getItem("cp-lstate") || ""; sessionStorage.removeItem("cp-lstate"); } catch (e) {}
  const [st, nonce] = ls.split("|");
  if (st && st !== u.get("state")) return Promise.resolve(false); // state 對不上＝不是這個分頁發起的登入
  return api({action: "lineLogin", code: u.get("code"), state: u.get("state"), nonce: nonce || ""}, {timeout: 60000})
    .then(r => { memTok = r.mt; lsSet("cp-mem", memTok); if (r.member) member = r.member; return true; }).catch(() => false);
})();
// 從 LINE（內建瀏覽器）開啟且還沒登入：直接走 LINE 登入（使用者 11-08：LINE 點進來就要登入）。
// LINE 內是免輸入的一鍵登入；每個分頁只自動嘗試一次（取消就不再跳），原本要去的 #member／#orders 等登入後帶回。
(async () => {
  if (!/\bLine\//i.test(navigator.userAgent) || memTok || lineBack) return;
  try { if (sessionStorage.getItem("cp-autologin")) return; sessionStorage.setItem("cp-autologin", "1"); if (location.hash) sessionStorage.setItem("cp-after-hash", location.hash); } catch (e) { return; }
  location.replace(lineAuthUrl());
})();
// LIFF：在 LIFF 裡開啟且未登入 → 載入 SDK、取 id_token 換會員權杖（不跳轉）
const LIFF_ID = "2012457738-sW2OqmOO";
const inLiff = /LIFF/i.test(navigator.userAgent) || /[?&]liff\./.test(location.search);
const liffP = (inLiff && !memTok && !lineBack) ? new Promise(res => {
  const sc = document.createElement("script"); sc.src = "https://static.line-scdn.net/liff/edge/2/sdk.js";
  sc.onload = async () => {
    try {
      await liff.init({liffId: LIFF_ID});
      if (!liff.isLoggedIn()) { liff.login({redirectUri: location.href}); return; }
      const r = await api({action: "liffLogin", idToken: liff.getIDToken(), accessToken: liff.getAccessToken()}, {timeout: 45000});
      memTok = r.mt; lsSet("cp-mem", memTok); if (r.member) member = r.member; res(true);
    } catch (e) { res(false); }
  };
  sc.onerror = () => res(false); document.head.appendChild(sc);
}) : null;
renderAll();
api(null, {tries: 3, timeout: 45000}).then(async d => {
  catalog = d; lsSet("cp-catalog4", {at: Date.now(), d});
  cart = cart.filter(l => d.products.some(p => p.id === l.id));
  renderAll();
  // LINE 登入回來：#lm=會員權杖（或 #lmerr=原因）
  if (location.hash.startsWith("#lm=") || location.hash.startsWith("#lmerr=")) {
    if (location.hash.startsWith("#lm=")) { memTok = location.hash.slice(4); lsSet("cp-mem", memTok); } else toast("LINE 登入未完成，請再試一次");
    history.replaceState(null, "", location.pathname);
  }
  if (lineBack) { const ok = await lineBack; if (!ok) { toast("LINE 登入未完成，請再試一次"); lsSet("cp-afterlogin", ""); } }
  const liffOk = liffP ? await liffP : false;
  if (!((lineBack || liffOk) && member)) await loadMember(); // 登入回來時會員資料已隨登入結果帶回，不必再查
  drawMemBtn();
  if (lineBack && member) toast(member.friend ? "登入成功，歡迎 " + (member.name || "會員") : "登入成功，加入官方帳號好友即可下單");
  if (lineBack && member && !lsGet("cp-afterlogin", "") && !/^#(member|orders|coupons|new|p=.*)$/.test(location.hash)) openMember("coupons"); // 登入完直接看到入會禮與會員權益
  if (lsGet("cp-afterlogin", "") && cart.length) { lsSet("cp-afterlogin", ""); step = "form"; drawCart(); openSheet("cSheet"); refreshQuote(); }
  if (location.hash.startsWith("#paid=")) { const no = location.hash.slice(6); history.replaceState(null, "", location.pathname); showPaid(no); }
  // LINE 圖文選單／歡迎卡片的捷徑：#member 會員中心（有入會禮就開優惠券）、#orders 我的訂單、#new 新品
  const hs = location.hash;
  if (/^#(member|orders|coupons)$/.test(hs)) { history.replaceState(null, "", location.pathname); openMember(hs === "#member" ? (member && member.friend ? "coupons" : undefined) : hs.slice(1)); }
  if (hs.startsWith("#p=")) { history.replaceState(null, "", location.pathname); const pid = decodeURIComponent(hs.slice(3)); if (catalog.products.some(x => x.id === pid)) openProduct(pid); }
  if (hs === "#new") { history.replaceState(null, "", location.pathname); const nb = document.querySelector('[data-sort="new"]'); if (nb) nb.click(); setTimeout(() => $("grid").scrollIntoView({behavior: "smooth", block: "start"}), 300); }
  // 從 7-11 電子地圖回來：#store={id,name,addr} → 存起來、回到填寫資料那一步
  if (location.hash.startsWith("#store=")) {
    try { store = JSON.parse(decodeURIComponent(location.hash.slice(7))); lsSet("cp-store", store); ship = SHIP_CVS; lsSet("cp-ship", ship); } catch (e) {}
    history.replaceState(null, "", location.pathname);
    if (cart.length) { step = "form"; drawCart(); openSheet("cSheet"); refreshQuote(); }
  }
}).catch(() => { if (!catalog) $("grid").innerHTML = '<div class="empty">連線失敗，請重新整理</div>'; });
