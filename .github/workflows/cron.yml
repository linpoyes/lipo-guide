# 賣場排程：每小時呼叫 Apps Script 一次（逾期未付款自動取消、入會禮到期提醒）。
# 只打公開的 ?action=cron，後端 15 分鐘內只會跑一次，不含任何金鑰。
name: shop-cron
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: curl -sSL --max-time 120 "https://script.google.com/macros/s/AKfycbxtUHvT661QSFsB8ACP0QSMq-8PCR9GIxFzXRFzArl4vswAy2YBd5ZbaSIrfGtcKls/exec?action=cron"
