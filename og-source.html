<!doctype html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#0E1626;color:#fff;
  font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;font-feature-settings:"tnum"}
.bg{position:absolute;inset:0;background:
  radial-gradient(700px 500px at 1050px 120px,rgba(44,123,229,.35),transparent 70%),
  radial-gradient(600px 400px at 100px 620px,rgba(232,148,28,.14),transparent 70%)}
.wrap{position:relative;height:100%;padding:56px 64px 44px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:40px}
.txt{flex:1}
/* 新圖示：取中間卡片，圓角裁掉原圖四角的陰影 */
.icon{width:290px;height:290px;border-radius:64px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.kick{font-size:34px;font-weight:700;color:#8FB8F5;letter-spacing:.14em}
h1{font-size:118px;font-weight:900;line-height:1.1;margin-top:8px;letter-spacing:.01em}
.stats{display:flex;gap:16px;margin-top:auto}
.st{flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:12px 24px}
.st .k{font-size:28px;color:#B9C6DD;font-weight:600}
.st .v{font-size:62px;font-weight:800;line-height:1.2}
.st .v small{font-size:28px;font-weight:600;color:#B9C6DD;margin-left:4px}
.st.g .v{color:#4FD39C} .st.o .v{color:#FFB547}
.foot{margin-top:20px;font-size:28px;letter-spacing:.12em;display:flex;align-items:center;gap:16px}
.foot .g{color:#D9B66E;font-weight:700} .foot .s{color:#A0A9BA;font-weight:600}
.foot i{width:1px;height:18px;background:rgba(255,255,255,.25)}
</style></head><body><div class="bg"></div>
<div class="wrap">
  <div class="top">
    <div class="txt">
      <h1>RC 鋰電池<br>充電</h1>
    </div>
    <img class="icon" src="icon-512.png" alt="">
  </div>
  <div class="stats">
    <div class="st"><div class="k">充飽電壓</div><div class="v">4.20<small>V／顆</small></div></div>
    <div class="st g"><div class="k">儲存電壓</div><div class="v">3.80<small>V／顆</small></div></div>
    <div class="st o"><div class="k">標準充電</div><div class="v">1C</div></div>
  </div>
  <div class="foot"><span class="g">欣群企業</span><i></i><span class="s">欣瀚資訊</span></div>
</div></body></html>
